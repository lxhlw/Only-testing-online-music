name: Modern Proxy Security Regression

on:
  pull_request:
    paths:
      - 'functions/api/proxy.js'
      - 'scripts/test-proxy-security.mjs'
      - 'scripts/test-proxy-production.mjs'
      - 'scripts/test-modern-flower-proxy.mjs'
      - '.github/workflows/proxy-security-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Secure modern Flower proxy and safe redirects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Check modern proxy and source syntax
        run: |
          node --check functions/api/proxy.js
          node --check scripts/test-proxy-security.mjs
          node --check scripts/test-modern-flower-proxy.mjs
      - name: SSRF, redirect, credential isolation and bounded Flower race
        run: |
          node scripts/test-proxy-security.mjs
          node scripts/test-modern-flower-proxy.mjs
      - name: Start local Cloudflare Pages
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 >/tmp/lx-proxy.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lx-proxy.log; exit 1
      - name: Verify public proxy denies unsafe URLs and cross-origin clients
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-proxy-production.mjs
