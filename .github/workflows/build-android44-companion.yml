name: Build Android 4.4 Native Companion APK

on:
  pull_request:
    paths:
      - 'android-companion/**'
      - 'src/android-native-xhr-fallback.js'
      - 'scripts/test-android44-bundled-fallback-browser.mjs'
      - 'src/app.js'
      - 'index.html'
      - 'scripts/test-native-companion-browser.mjs'
      - '.github/workflows/build-android44-companion.yml'
  push:
    branches: [main]
    paths:
      - 'android-companion/**'
      - 'src/android-native-xhr-fallback.js'
      - 'scripts/test-android44-bundled-fallback-browser.mjs'
      - 'src/app.js'
      - 'index.html'
      - 'scripts/test-native-companion-browser.mjs'
      - '.github/workflows/build-android44-companion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android API 19 installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled runner SDK and install API 35
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed debug APK
        run: gradle --no-daemon -p android-companion :app:assembleDebug
      - name: Check APK existence and min SDK
        run: |
          test -s android-companion/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-companion/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-companion/app/build/outputs/apk/debug/app-debug.apk | grep "sdkVersion:'19'"
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LX-Music-Android-4.4-Phase1-APK
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download link (test APK; not an app-store release)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android44-bundled-xhr-v03-20261027"
          APK="android-companion/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing test release found: not overwriting the publicly downloadable APK."
          else
            gh release create "$TAG" "$APK#LXMusic-Android44-v0.3-BundledXHR.apk" \
              --target "$GITHUB_SHA" \
              --title "LX Music Android 4.4 - bundled XHR bootstrap beta 0.3" \
              --notes "Android 4.4.2/API 19 MediaPlayer + APK-bundled ES5 XHR bootstrap; fixes WebView fallback unavailable failure, awaits page readiness, checks first-party HTTPS. Debug build. This is a prerelease for physical tablet sound validation, not a verified production app. On the tablet, test 本地试听 first, then 联网试听, then music search. If you have an older debug APK installed, Android may require uninstalling it because CI debug signing keys can differ." \
              --prerelease
          fi
          gh release view "$TAG" --json url -q .url
          gh release view "$TAG" --json assets -q '.assets[].name'
