name: GD Studio Kuwo Search Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe current GD Studio search formats
        run: |
          cat > probe.mjs <<'EOF'
const endpoints = [
  'https://music-api.gdstudio.xyz/api.php',
  'https://music.gdstudio.xyz/api.php',
]
const query = new URLSearchParams({
  types: 'search',
  source: 'kuwo',
  name: '周杰伦',
  count: '5',
  pages: '1',
})
const headers = {
  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36',
  'Accept': 'application/json, text/javascript, */*; q=0.01',
  'Origin': 'https://music.gdstudio.xyz',
  'Referer': 'https://music.gdstudio.xyz/',
}
for (const endpoint of endpoints) {
  for (const method of ['GET', 'POST']) {
    try {
      let response
      if (method === 'GET') {
        response = await fetch(endpoint + '?' + query.toString(), { method, headers })
      } else {
        response = await fetch(endpoint, {
          method,
          headers: { ...headers, 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
          body: query.toString(),
        })
      }
      const body = await response.text()
      console.log(JSON.stringify({ endpoint, method, status: response.status, body: body.slice(0, 1500) }))
    } catch (error) {
      console.log(JSON.stringify({ endpoint, method, error: String(error) }))
    }
  }
}

EOF
          node probe.mjs
