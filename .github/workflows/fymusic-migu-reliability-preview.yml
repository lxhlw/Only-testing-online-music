name: FyMusic · Migu LRC Reliability Preview (nonproduction)
on:
  push:
    branches: [fix/fymusic-migu-lrc-bounded-retry-20261104]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fymusic-migu-lrc-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PROJECT: only-testing-online-music
      PREVIEW_BRANCH: migu-lrc-stage5a-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard nonproduction branch and verify script syntax
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/fymusic-migu-lrc-bounded-retry-20261104
          test "$PREVIEW_BRANCH" != main
          node --check functions/api/migu-lyrics.js
          node --check scripts/test-migu-lyrics-preview-live.mjs
          node --check scripts/test-seamless-live-daoxiang-preview.mjs
      - name: Run bounded retry and source-security tests
        run: |
          npm install --no-audit --no-fund
          node scripts/test-migu-lyrics-endpoint.mjs
          node scripts/check-handoff-privacy.mjs
          npm run build:pages
          npm run test:pages
          npx playwright install --with-deps chromium
      - name: Deploy isolated Cloudflare Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler pages deploy dist --project-name "$PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$GITHUB_SHA" | tee /tmp/fymusic-migu-preview.log
          url=$(grep -Eo 'https://[0-9a-f]{8}\.only-testing-online-music\.pages\.dev' /tmp/fymusic-migu-preview.log | head -n1)
          test -n "$url"
          test "$url" != https://only-testing-online-music.pages.dev
          echo "TEST_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "FYMUSIC_MIGU_PREVIEW_URL=$url"
      - name: Strict live Migu audio + timed lyrics + cover + pause resume
        run: node scripts/test-migu-lyrics-preview-live.mjs
      - name: Strict Daoxiang Kugou-to-Kuwo real media fallback
        if: success()
        run: node scripts/test-seamless-live-daoxiang-preview.mjs
      - name: Verify production branch not changed
        if: always()
        run: echo FYMUSIC_MIGU_PREVIEW_NOT_PRODUCTION
