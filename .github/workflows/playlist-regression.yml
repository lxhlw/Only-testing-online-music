name: Playlist Regression (PR)

on:
  pull_request:
    paths:
      - "index.html"
      - "functions/api/netease-playlists.js"
      - "scripts/test-playlist-browser.mjs"
      - "scripts/test-netease-playlists-api.mjs"
      - "scripts/test-playlist-pagination-browser.mjs"
      - "scripts/test-playlist-via-navigation-browser.mjs"
      - ".github/workflows/playlist-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playlist:
    name: Deterministic playlist API and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate syntax
        run: |
          node --check functions/api/netease-playlists.js
          node --check scripts/test-netease-playlists-api.mjs
          node --check scripts/test-playlist-pagination-browser.mjs
          node --check scripts/test-playlist-browser.mjs

      - name: Test existing project contracts and core modules
        run: |
          node scripts/test-version.mjs
          node scripts/test-legacy-web.mjs
          node scripts/test-music-library.mjs
          node scripts/test-music-lyrics.mjs
          node scripts/test-settings.mjs
          node scripts/test-music-search-native.mjs
          node scripts/test-source-transpiler.mjs

      - name: Test NetEase playlist API without external network
        run: node scripts/test-netease-playlists-api.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Pages server
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/playlist-wrangler.log 2>&1 &
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8788/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/playlist-wrangler.log
          exit 1

      - name: Test responsive layout
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-responsive-browser.mjs

      - name: Verify Via touch navigation holds the playlist detail
        run: node scripts/test-playlist-via-navigation-browser.mjs

      - name: Test playlist UI with mocked API responses
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-playlist-pagination-browser.mjs

      # This relies on third-party Flower and NetEase endpoints. Record the
      # result for diagnostics without blocking deterministic regression checks.
      - name: Live playlist integration smoke (informational)
        continue-on-error: true
        timeout-minutes: 3
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
          TEST_PLAYLIST_KEYWORD: '周杰伦'
        run: node scripts/test-playlist-browser.mjs

      - name: Display local server logs on failure
        if: failure()
        run: cat /tmp/playlist-wrangler.log || true
