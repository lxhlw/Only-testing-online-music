name: FyMusic v2.12.6 Native Preload Parity (Windows)
on:
  push:
    branches: [feature/fymusic-playback-verifier]
    paths:
      - '.github/workflows/fymusic-native-parity.yml'
      - 'scripts/diagnostics/fymusic-native-parity.mjs'
      - 'scripts/diagnostics/fymusic-original-electron-main.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-preload-parity:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate test syntax
        run: |
          node --check scripts/diagnostics/fymusic-native-parity.mjs
          node --check scripts/diagnostics/fymusic-original-electron-main.cjs
      - name: Install diagnostic dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund electron@42.11.6 esbuild@0.25.12 tunnel@0.0.6
          npx playwright install chromium
      - name: Start isolated Cloudflare Pages server on Windows
        shell: pwsh
        run: |
          $job = Start-Process -FilePath "cmd.exe" -ArgumentList '/c','npx wrangler pages dev . --ip 127.0.0.1 --port 8788' -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\fymusic-native-pages.log" -RedirectStandardError "$env:RUNNER_TEMP\fymusic-native-pages.err.log"
          for ($i=0; $i -lt 55; $i++) {
            try {
              $r=Invoke-WebRequest -Uri "http://127.0.0.1:8788/api/audio-selftest" -TimeoutSec 3
              if ($r.StatusCode -eq 200) { exit 0 }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Get-Content "$env:RUNNER_TEMP\fymusic-native-pages.err.log" -ErrorAction SilentlyContinue
          exit 1
      - name: Run native official-preload and FyMusic comparison
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/diagnostics/fymusic-native-parity.mjs
