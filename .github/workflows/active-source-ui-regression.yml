name: Active LX Source UI Regression (PR)

on:
  pull_request:
    paths:
      - "src/app.js"
      - "src/source-manager.js"
      - "index.html"
      - "styles.css"
      - "scripts/test-active-source-ui-browser.mjs"
      - ".github/workflows/active-source-ui-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-source-ui:
    name: Active-source visibility and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check legacy page syntax and version
        run: |
          node scripts/test-version.mjs
          node scripts/test-legacy-web.mjs
          node --check src/app.js
          node --check src/source-manager.js
          node --check scripts/test-active-source-ui-browser.mjs
          node scripts/test-source-selection.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Cloudflare Pages emulator
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/source-ui-wrangler.log 2>&1 &
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8788/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/source-ui-wrangler.log
          exit 1

      - name: Test visible current-source selection on desktop, tablet and phone
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-active-source-ui-browser.mjs

      - name: Log server output on failure
        if: failure()
        run: cat /tmp/source-ui-wrangler.log || true
