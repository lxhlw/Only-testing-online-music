name: Test Original SixYin In Chromium

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sixyin-browser:
    name: LX source browser ${{ matrix.source.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        source:
          - name: "sixyin-1.2.0"
            url: "https://raw.githubusercontent.com/pdone/lx-music-source/main/sixyin/1.2.0.js"
          - name: "sixyin-1.2.1"
            url: "https://raw.githubusercontent.com/pdone/lx-music-source/main/sixyin/1.2.1.js"
          - name: "lx-latest"
            url: "https://ghproxy.net/raw.githubusercontent.com/pdone/lx-music-source/main/lx/latest.js"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1

      - name: Test original SixYin in real Chromium
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
          LX_SOURCE_URL: ${{ matrix.source.url }}
          LX_SOURCE_NAME: ${{ matrix.source.name }}
          SIXYIN_INIT_TIMEOUT_MS: 30000
        run: node scripts/test-sixyin-browser.mjs

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/wrangler.log || true
