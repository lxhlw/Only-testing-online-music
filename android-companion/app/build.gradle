plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.lxmusic.legacy'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.lxmusic.legacy'
        minSdk 19
        targetSdk 28
        versionCode 11
        versionName '0.11.0-flower-optin'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
