name: Default Sources And Via Regression (PR)

on:
  pull_request:
    paths:
      - "src/source-manager.js"
      - "src/app.js"
      - "scripts/test-native-companion-browser.mjs"
      - "index.html"
      - "scripts/test-android44-native-media-url-browser.mjs"
      - "src/android-native-resolver.js"
      - "scripts/test-android44-native-resolver-browser.mjs"
      - "scripts/test-chrome30-strict-syntax.mjs"
      - "package.json"
      - "scripts/bundle-android44-webui.mjs"
      - "scripts/test-android44-bundled-ui-browser.mjs"
      - "android-companion/app/src/main/java/dev/lxmusic/legacy/ModernPageInterceptor.java"
      - "src/android-native-xhr-fallback.js"
      - "scripts/test-android44-tls-xhr-fallback-browser.mjs"
      - "scripts/test-android44-bundled-fallback-browser.mjs"
      - "android-companion/app/src/main/assets/android-native-xhr-fallback.js"
      - "audio-test.html"
      - "src/android-external-audio.js"
      - "scripts/test-android-external-intent-browser.mjs"
      - "functions/api/diagnostic-report.js"
      - "scripts/test-diagnostic-report.mjs"
      - "scripts/test-diagnostic-report-browser.mjs"
      - "scripts/generate-android44-audio.mjs"
      - "scripts/test-android44-encoded-media-browser.mjs"
      - "functions/api/audio-selftest.js"
      - "functions/api/legacy-audio.js"
      - "functions/api/audio-selftest.mp3.js"
      - "scripts/test-android44-real-audio-browser.mjs"
      - "scripts/test-default-sources-legacy-browser.mjs"
      - "scripts/test-default-source-race-browser.mjs"
      - "scripts/test-playlist-via-navigation-browser.mjs"
      - "scripts/test-via44-search-playback-browser.mjs"
      - "scripts/test-via44-no-source-browser.mjs"
      - "scripts/test-import-ui.mjs"
      - ".github/workflows/default-sources-via-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  via-defaults:
    name: New-device auto sources and Via playlist/search
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Install pinned FFmpeg encoder
        run: npm install --no-save --no-audit --no-fund @ffmpeg-installer/ffmpeg@1.1.0

      - name: Generate genuine MP3 and WAV test files
        run: node scripts/generate-android44-audio.mjs
      - name: Validate ES5, page assets and source selection
        run: |
          node --check src/source-manager.js
          node --check src/app.js
          node --check scripts/test-android44-native-media-url-browser.mjs
          node --check src/android-native-resolver.js
          node --check scripts/test-android44-native-resolver-browser.mjs
          node --check scripts/bundle-android44-webui.mjs
          node --check scripts/test-android44-bundled-ui-browser.mjs
          node --check src/android-native-xhr-fallback.js
          node --check scripts/test-android44-tls-xhr-fallback-browser.mjs
          node --check scripts/test-android44-bundled-fallback-browser.mjs
          node --check scripts/test-native-companion-browser.mjs
          node --check src/android-external-audio.js
          node --check scripts/test-android-external-intent-browser.mjs
          node --check scripts/test-android44-real-audio-browser.mjs
          node --check scripts/test-android44-encoded-media-browser.mjs
          node --check functions/api/audio-selftest.js
          node --check scripts/test-default-sources-legacy-browser.mjs
          node --check scripts/test-default-source-race-browser.mjs
          node --check scripts/test-via44-no-source-browser.mjs
          node scripts/test-version.mjs
          node scripts/test-legacy-web.mjs
          node scripts/test-source-selection.mjs
          node scripts/test-diagnostic-report.mjs
      - run: npx playwright install chromium
      - name: Start Pages simulator
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/default-via.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/default-via.log
          exit 1
      - name: Strict ES5 parse of all Chrome 30 production scripts
        run: node scripts/test-chrome30-strict-syntax.mjs

      - name: Verify legacy import-button click without source-bootstrap races
        run: node scripts/test-import-ui.mjs
      - name: Verify actual MP3/WAV decoders and playback progress
        run: node scripts/test-android44-encoded-media-browser.mjs

      - name: Verify Android companion bridge overrides broken HTML5 Audio
        run: node scripts/test-native-companion-browser.mjs

      - name: Verify APK-bundled XHR recovers when website script is missing
        run: node scripts/test-android44-bundled-fallback-browser.mjs

      - name: Verify Android 4.4 XHR-to-native TLS fallback byte integrity
        run: node scripts/test-android44-tls-xhr-fallback-browser.mjs

      - name: Verify APK-pinned UI initializes controls in simulated Android 4.4
        run: |
          node scripts/bundle-android44-webui.mjs
          node scripts/test-android44-bundled-ui-browser.mjs

      - name: Verify resolved media addresses and direct retry stay first-party in native APK
        run: node scripts/test-android44-native-media-url-browser.mjs

      - name: Verify API19 native resolver GET POST statuses
        run: node scripts/test-android44-native-resolver-browser.mjs

      - name: Verify Android 4.4 external player ACTION_VIEW intent handoff
        run: node scripts/test-android-external-intent-browser.mjs

      - name: Verify one-tap diagnostic card and privacy-scoped upload
        run: node scripts/test-diagnostic-report-browser.mjs

      - name: Verify native Android 4.4 MP3 media fallback and Range responses
        run: node scripts/test-android44-real-audio-browser.mjs

      - name: Test new device auto import and Via 成都 search
        run: node scripts/test-default-sources-legacy-browser.mjs
      - name: Test manually selected source wins over delayed defaults
        run: node scripts/test-default-source-race-browser.mjs
      - name: Verify actual 320k to 128k audio quality fallback
        run: node scripts/test-quality-fallback-browser.mjs
      - name: Test Via playlist detail stays visible and tracks work
        run: node scripts/test-playlist-via-navigation-browser.mjs
      - name: Test Via search/playback when GitHub defaults are offline
        run: node scripts/test-via44-no-source-browser.mjs
      - name: Test Via search failure retry and compressed default audio
        run: node scripts/test-via44-search-playback-browser.mjs
      - name: Show logs on failure
        if: failure()
        run: cat /tmp/default-via.log || true
