name: FyMusic · Autoplay and Quality Preview (nonproduction)
on:
  push:
    branches: [fix/fymusic-autoplay-diagnostics-quality-20261103]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fymusic-autoplay-quality-preview-20261103
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build restricted Pages and install Chromium
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/fymusic-autoplay-diagnostics-quality-20261103
          npm install --no-audit --no-fund
          node scripts/build-pages-dist.mjs
          node scripts/test-pages-dist.mjs
          node scripts/test-playback-quality-policy.mjs
          node --check scripts/test-playback-rejection-browser.mjs
          npx playwright install --with-deps chromium
      - name: Deploy isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler pages deploy dist --project-name only-testing-online-music --branch autoplay-quality-test --commit-hash "$GITHUB_SHA" | tee /tmp/fymusic-v0433-preview.log
          url=$(grep -Eo 'https://[0-9a-f]{8}\.only-testing-online-music\.pages\.dev' /tmp/fymusic-v0433-preview.log | head -n1)
          test -n "$url"
          test "$url" != https://only-testing-online-music.pages.dev
          echo "TEST_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "FYMUSIC_V0433_PREVIEW_URL=$url"
      - name: Verify version, removed file guard, and real browser policy
        run: |
          set -euo pipefail
          curl -fsSL "$TEST_BASE_URL/version.json" | grep -Fq '"0.4.33"'
          code=$(curl -sSL -o /tmp/fymusic-retained -w '%{http_code}' "$TEST_BASE_URL/README.md")
          test "$code" = 404
          node scripts/test-playback-rejection-browser.mjs
      - name: Verify unmocked alternative Daoxiang audio, album and timed lyrics
        run: node scripts/test-seamless-live-daoxiang-preview.mjs
