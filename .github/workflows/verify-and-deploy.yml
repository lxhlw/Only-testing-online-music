name: Modern Web · Verify And Deploy
on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'modern.css'
      - 'src/**'
      - 'scripts/build-pages-dist.mjs'
      - 'scripts/test-pages-dist.mjs'
      - 'scripts/test-modern-web-browser.mjs'
      - 'scripts/test-version.mjs'
      - 'scripts/test-flower-*.mjs'
      - 'scripts/flower-*.mjs'
      - 'scripts/test-lx-runtime-flower-md5.mjs'
      - 'scripts/test-lx-runtime-crypto-parity.mjs'
      - 'scripts/test-flower-kugou-tag-reference-unit.mjs'
      - 'scripts/test-chart-catalog.mjs'
      - 'scripts/test-playlist-infinite-browser.mjs'
      - 'scripts/test-mobile-interaction-qa-browser.mjs'
      - 'scripts/test-web-source-selection-browser.mjs'
      - 'scripts/test-huibq-explicit-playback-live.mjs'
      - 'package.json'
      - 'version.json'
      - 'settings.html'
      - 'functions/**'
      - '.github/workflows/verify-and-deploy.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Modern browser UX + audio + security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build allowlisted Pages site and exclude repository/test assets
        run: |
          node scripts/build-pages-dist.mjs
          node scripts/test-pages-dist.mjs
      - name: Modern JS parse checks
        run: |
          node --check src/app.js
          node --check src/fymusic-cross-platform-match.js
          node --check scripts/test-seamless-cross-platform-match.mjs
          node --check scripts/test-seamless-cross-platform-browser.mjs
          node --check scripts/test-seamless-live-sunyanzi-preview.mjs
          node --check src/source-manager.js
          node --check src/source-transpiler-modern.js
          node --check src/modern-ui.js
          node --check src/mobile-shell.js
          node --check src/now-playing-experience.js
          node --check functions/api/migu-lyrics.js
          node --check scripts/test-migu-lyrics-endpoint.mjs
          node --check scripts/test-migu-lyrics-preview-live.mjs
          node --check functions/api/kuwo-song-meta.js
          node --check scripts/test-kuwo-preview-live.mjs
          node --check scripts/test-now-playing-kuwo-browser.mjs
          node --check functions/api/netease-song-meta.js
          node --check functions/api/netease-comments.js
          node --check functions/api/qq-catalog.js
          node --check functions/api/netease-toplist.js
          node --check scripts/test-modern-web-browser.mjs
          node --check scripts/test-playlist-infinite-browser.mjs
          node --check scripts/test-mobile-interaction-qa-browser.mjs
          node --check scripts/test-web-source-selection-browser.mjs
          node --check scripts/test-huibq-explicit-playback-live.mjs
          node --check scripts/test-modern-flower-proxy.mjs
          node --check scripts/test-flower-cross-platform-live.mjs
          node --check scripts/test-flower-correlated-live.mjs
          node --check scripts/test-flower-kugou-transport-live.mjs
          node --check scripts/test-flower-kugou-quality-live.mjs
          node --check scripts/test-flower-kugou-tag-reference-unit.mjs
          node --check scripts/test-flower-kugou-variants-live.mjs
          node --check scripts/flower-kugou-quality-parity.mjs
          node --check scripts/flower-raw-http1-parity.mjs
          node --check scripts/flower-egress-parity.mjs
          node --check scripts/flower-correlated-validation.mjs
          node --check scripts/test-flower-audio-live.mjs
          node --check scripts/test-lx-runtime-crypto-parity.mjs
          node --check scripts/test-flower-kuwo-ui-live.mjs
          node --check scripts/test-flower-ui-stability-live.mjs
          node --check scripts/flower-media-validation.mjs
          node --check scripts/flower-needle-parity.mjs
          node --check scripts/test-flower-needle-parity.mjs
          node --check scripts/flower-cross-platform-diagnostic.mjs
      - name: Version metadata and cache-busting regression
        run: node scripts/test-version.mjs
      - name: Security and local music library regression
        run: |
          node scripts/test-proxy-security.mjs
          node scripts/test-modern-flower-proxy.mjs
          node scripts/test-flower-protocol-parity-unit.mjs
          node scripts/test-lx-runtime-flower-md5.mjs
          node scripts/test-lx-runtime-crypto-parity.mjs
          node scripts/test-flower-needle-parity.mjs
          node scripts/test-flower-raw-http1-parity-unit.mjs
          node scripts/test-music-search-native.mjs
          node scripts/test-flower-egress-parity-unit.mjs
          node scripts/test-flower-kugou-quality-parity-unit.mjs
          node scripts/test-flower-kugou-tag-reference-unit.mjs
          node scripts/test-flower-cross-platform-unit.mjs
          node scripts/test-flower-correlated-validation-unit.mjs
          node scripts/test-flower-media-validation-unit.mjs
          node scripts/test-flower-tcp-socket.mjs
          node scripts/test-music-library.mjs
          node scripts/test-music-lyrics.mjs
          node scripts/test-netease-lyrics.mjs
          node scripts/test-now-playing-apis.mjs
          node scripts/test-migu-lyrics-endpoint.mjs
          node scripts/test-seamless-cross-platform-match.mjs
          node scripts/test-kuwo-track-info.mjs
          node scripts/test-chart-catalog.mjs
      - name: Compare original LX Desktop NetEase EAPI search with Web (diagnostic)
        continue-on-error: true
        run: node scripts/test-desktop-netease-eapi-parity.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Start Cloudflare Pages emulator and run modern web browser regression
        run: |
          set -euo pipefail
          npx wrangler pages dev dist --ip 127.0.0.1 --port 8788 >/tmp/lx-modern-pages.log 2>&1 &
          READY=0
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat /tmp/lx-modern-pages.log; exit 1; fi
          node scripts/test-modern-web-browser.mjs
          node scripts/test-now-playing-kuwo-browser.mjs
          node scripts/test-seamless-cross-platform-browser.mjs
          node scripts/test-playlist-infinite-browser.mjs
          node scripts/test-mobile-interaction-qa-browser.mjs
          node scripts/test-web-source-selection-browser.mjs

  deploy:
    name: Publish verified modern site
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://only-testing-online-music.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Cloudflare deploy dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/build-pages-dist.mjs
          node scripts/test-pages-dist.mjs
          npx wrangler pages deploy dist --project-name only-testing-online-music --commit-hash "$GITHUB_SHA"
      - name: Verify production entrypoint and modern assets
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('version.json','utf8')).version")
          READY=0
          for i in {1..12}; do
            if curl -fsSL "https://only-testing-online-music.pages.dev/?v=$VERSION" -o /tmp/lx-modern-index.html && grep -Fq "modern.css?v=$VERSION" /tmp/lx-modern-index.html; then
              READY=1
              break
            fi
            sleep 5
          done
          test "$READY" = "1"
          curl -fsSL https://only-testing-online-music.pages.dev/modern.css -o /tmp/lx-modern.css
          grep -Fq 'LX Music Modern' /tmp/lx-modern.css
          grep -Fq 'Eye-care mint design' /tmp/lx-modern.css
          curl -fsSL https://only-testing-online-music.pages.dev/src/mobile-shell.css -o /tmp/lx-mobile-css
          grep -Fq 'native-inspired mobile shell' /tmp/lx-mobile-css
          curl -fsSL https://only-testing-online-music.pages.dev/src/mobile-shell.js -o /tmp/lx-mobile-js
          grep -Fq 'mobile-shell-ready' /tmp/lx-mobile-js
          curl -fsSL https://only-testing-online-music.pages.dev/src/modern-ui.js -o /tmp/lx-modern-ui.js
          grep -Fq 'mediaSession' /tmp/lx-modern-ui.js

      - name: Verify no repository files are exposed as public website assets
        run: |
          set -euo pipefail
          # Pages' production hostname can briefly serve a previous edge
          # route during deploy propagation. Only an actual, stable branded
          # 404 passes; an exposed non-HTML repository file fails immediately.
          for path in README.md package.json scripts/test-modern-web-browser.mjs android-companion/README.md .github/workflows/verify-and-deploy.yml; do
            ready=0
            for attempt in {1..12}; do
              code=$(curl -sSL --max-time 12 -o /tmp/fymusic-not-found.html -w '%{http_code}' "https://only-testing-online-music.pages.dev/$path")
              if test "$code" = 404 && grep -Fq '404 · Not found' /tmp/fymusic-not-found.html; then
                ready=1; break
              fi
              if test "$code" = 200 &&
                 ! grep -Eiq '<!doctype html|<html[ >]' /tmp/fymusic-not-found.html; then
                echo "Real public repository content exposed: $path HTTP $code"
                exit 1
              fi
              sleep 2
            done
            if test "$ready" != 1; then
              echo "Protected path never became branded HTTP 404: $path last_status=$code"
              exit 1
            fi
          done
          code=$(curl -sSL -o /tmp/fymusic-proxy-guard.json -w '%{http_code}' 'https://only-testing-online-music.pages.dev/api/proxy')
          test "$code" = 400 || exit 1

      - name: Verify deployed version metadata
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://only-testing-online-music.pages.dev/version.json -o /tmp/lx-production-version.json
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const local = JSON.parse(fs.readFileSync("version.json", "utf8"));
            const remote = JSON.parse(fs.readFileSync("/tmp/lx-production-version.json", "utf8"));
            assert.equal(remote.version, local.version, "Production version must equal the release commit");
            console.log("Production version verified:", remote.version);
          '
      - name: Install Chromium for production browser acceptance
        run: npx playwright install --with-deps chromium webkit
      - name: Browser acceptance against the actual Cloudflare Pages site
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
        run: |
          set -euo pipefail
          node scripts/test-modern-web-browser.mjs
          node scripts/test-now-playing-kuwo-browser.mjs
          node scripts/test-seamless-cross-platform-browser.mjs
          node scripts/test-playlist-infinite-browser.mjs
          node scripts/test-mobile-interaction-qa-browser.mjs
      - name: Real Kuwo cover metadata and timed lyrics against the deployed website
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
          FYMUSIC_ACCEPT_PRODUCTION: '1'
        run: node scripts/test-kuwo-preview-live.mjs
      - name: Real Kugou-failure cross-platform recovery with Sun Yanzi (informational)
        continue-on-error: true
        timeout-minutes: 4
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
          FYMUSIC_ACCEPT_PRODUCTION: '1'
        run: node scripts/test-seamless-live-sunyanzi-preview.mjs
      - name: Real Migu Sun Yanzi song playback, artwork, timed lyric, pause and resume
        timeout-minutes: 4
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
          FYMUSIC_ACCEPT_PRODUCTION: '1'
        run: node scripts/test-migu-lyrics-preview-live.mjs
      - name: Explicit Huibq LX source real-media feasibility (informational)
        continue-on-error: true
        timeout-minutes: 3
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
        run: node scripts/test-huibq-explicit-playback-live.mjs
      - name: Live Flower musicUrl smoke (upstream diagnostic; no simulated audio)
        continue-on-error: true
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
        run: node scripts/test-flower-live-production.mjs
      - name: Real Flower multi-platform song resolver matrix (informational)
        continue-on-error: true
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
        run: node scripts/test-flower-cross-platform-live.mjs
      - name: Real Flower same-request five-platform two-round resolver and audio diagnostic
        continue-on-error: true
        timeout-minutes: 8
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
        run: node scripts/test-flower-correlated-live.mjs
      - name: Real Flower Kugou Chengdu hash and upstream failure diagnosis (informational)
        continue-on-error: true
        timeout-minutes: 4
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
          FLOWER_DIAGNOSTIC_CASE: kugou-chengdu
        run: node scripts/test-flower-correlated-live.mjs
      - name: Real Flower Kugou Chengdu GitHub Node vs LX Desktop Needle signed origin comparison
        continue-on-error: true
        timeout-minutes: 3
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
        run: node scripts/test-flower-kugou-transport-live.mjs
      - name: Real Flower Kugou Chengdu live quality and source fingerprint parity (informational)
        continue-on-error: true
        timeout-minutes: 3
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
        run: node scripts/test-flower-kugou-quality-live.mjs
      - name: Real Flower Kugou Chengdu all matching recordings matrix (informational)
        continue-on-error: true
        timeout-minutes: 3
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
        run: node scripts/test-flower-kugou-variants-live.mjs
      - name: Real Flower KW/MG audio bytes and seek acceptance (informational)
        continue-on-error: true
        timeout-minutes: 4
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
        run: node scripts/test-flower-audio-live.mjs
      - name: Real Flower Kuwo and Migu UI two-round stability (informational)
        continue-on-error: true
        timeout-minutes: 9
        env:
          TEST_BASE_URL: https://only-testing-online-music.pages.dev
        run: node scripts/test-flower-ui-stability-live.mjs
      - name: Live QQ playlist keyword smoke (upstream diagnostic)
        continue-on-error: true
        run: |
          node --input-type=module - <<'NODE'
          const target = new URL('https://only-testing-online-music.pages.dev/api/qq-catalog');
          target.searchParams.set('kind','playlist');
          target.searchParams.set('s','民谣');
          target.searchParams.set('limit','20');
          const signal=AbortSignal.timeout(16000);
          const response=await fetch(target,{signal,headers:{Accept:'application/json'}});
          const result=await response.json();
          if(!response.ok || !Array.isArray(result?.result?.playlists)){
            throw new Error('Live QQ keyword search unavailable: HTTP '+response.status+' '+JSON.stringify(result).slice(0,250));
          }
          console.log('Live QQ keyword search responded with',result.result.playlists.length,'playlists');
          NODE
      - name: Live NetEase playlist catalog smoke (upstream diagnostic)
        continue-on-error: true
        run: |
          node --input-type=module - <<'NODE'
          const target='https://only-testing-online-music.pages.dev/api/netease-playlists?limit=20&offset=0';
          const response=await fetch(target,{signal:AbortSignal.timeout(16000)});
          const result=await response.json();
          if(!response.ok || !Array.isArray(result?.result?.playlists)){
            throw new Error('Live NetEase playlist catalog unavailable: HTTP '+response.status+' '+JSON.stringify(result).slice(0,250));
          }
          console.log('Live NetEase playlist catalog responded with',result.result.playlists.length,'playlists');
          NODE
