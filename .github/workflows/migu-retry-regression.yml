name: Migu Retry Guard Regression (PR)

on:
  pull_request:
    paths:
      - "src/music-search.js"
      - "scripts/test-music-search-native.mjs"
      - "index.html"
      - ".github/workflows/migu-retry-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migu-retry:
    name: Migu retry isolation and expiry
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Check JS syntax and legacy version contract
        run: |
          node --check src/music-search.js
          node --check scripts/test-music-search-native.mjs
          node scripts/test-version.mjs
          node scripts/test-legacy-web.mjs
      - name: Verify no duplicate Migu resolver loops and TTL recovery
        run: node scripts/test-music-search-native.mjs
      - name: Verify Migu track IDs and accurate errors
        run: node scripts/test-migu-track-ids.mjs
