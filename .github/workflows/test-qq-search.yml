name: Test QQ Search

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qq-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Search 成都
        run: node scripts/test-qq-search.mjs
