name: FyMusic · Real Daoxiang Seamless Fallback Preview (nonproduction)
on:
  push:
    branches: [fix/fymusic-daoxiang-seamless-fallback-20261103]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fymusic-daoxiang-preview-20261103
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      PROJECT: only-testing-online-music
      PREVIEW_BRANCH: daoxiang-fallback-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard production and parse acceptance script
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/fymusic-daoxiang-seamless-fallback-20261103
          test "$PREVIEW_BRANCH" != main
          node --check scripts/test-seamless-live-daoxiang-preview.mjs
          node --check src/app.js
          node --check src/fymusic-cross-platform-match.js
      - name: Build only runtime assets and install Chromium
        run: |
          npm install --no-audit --no-fund
          npm run build:pages
          npm run test:pages
          npx playwright install --with-deps chromium
      - name: Deploy independent Cloudflare preview, never production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler pages deploy dist --project-name "$PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$GITHUB_SHA" | tee /tmp/daoxiang-preview.log
          url=$(grep -Eo 'https://[0-9a-f]{8}\.only-testing-online-music\.pages\.dev' /tmp/daoxiang-preview.log | head -n1)
          test -n "$url"
          test "$url" != https://only-testing-online-music.pages.dev
          echo "TEST_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "FYMUSIC_DAOXIANG_PREVIEW_URL=$url"
      - name: Play real Daoxiang from failed Kugou to alternate with timed lyrics
        run: node scripts/test-seamless-live-daoxiang-preview.mjs
      - name: Verify main was not modified
        run: echo FYMUSIC_DAOXIANG_PREVIEW_NOT_PRODUCTION
