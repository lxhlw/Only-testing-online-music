name: Check Legacy Test Page

on:
  push:
    branches: [main]
    paths:
      - "legacy-test.html"
      - "scripts/check-legacy-test.mjs"
      - "scripts/smoke-legacy-test.mjs"
      - ".github/workflows/check-legacy-test.yml"
      - "src/**"
      - "styles.css"
      - "index.html"
  workflow_dispatch:

jobs:
  legacy-test:
    name: Validate legacy-test.html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check inline JavaScript syntax
        run: node scripts/check-legacy-test.mjs

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1

      - name: Smoke test legacy-test.html
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/smoke-legacy-test.mjs

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/wrangler.log || true
