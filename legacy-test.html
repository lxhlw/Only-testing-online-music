<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Legacy Browser Test</title>
  <style>
    html,body{margin:0;padding:0;background:#f4f6f8;color:#222;font-family:Arial,sans-serif;font-size:16px}
    body{padding:14px}
    h1{font-size:22px;margin:0 0 6px}
    p{margin:6px 0 12px}
    .card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
    .row{padding:8px 0;border-bottom:1px solid #eee;word-break:break-word}
    .row:last-child{border-bottom:0}
    .label{display:inline-block;min-width:150px;font-weight:bold}
    .pass{color:#087f23;font-weight:bold}
    .fail{color:#b00020;font-weight:bold}
    .warn{color:#996600;font-weight:bold}
    button,a{display:inline-block;padding:9px 12px;margin:4px 6px 4px 0;border:1px solid #bbb;border-radius:6px;background:#eee;color:#111;text-decoration:none}
    button{font:inherit}
    textarea{width:100%;min-height:180px;box-sizing:border-box;border:1px solid #bbb;border-radius:6px;padding:8px;font:13px monospace;background:#fafafa;color:#222}
  </style>
</head>
<body>
  <div class="card">
    <h1>Android 4.4 / Via 浏览器自检</h1>
    <p>此页面测试浏览器与当前 Web 项目的基础能力，不依赖远端音乐服务。</p>
    <div id="summary">正在检测……</div>
    <button id="copy-btn" type="button">复制完整检测报告</button>
    <button id="copy-short-btn" type="button">复制精简报告</button>
    <div id="copy-status"></div>
  </div>

  <div class="card">
    <h2>基础能力</h2>
    <div id="checks"></div>
  </div>

  <div class="card">
    <h2>实际音频播放</h2>
    <p>点击下面按钮。页面会在本机内存中生成一段很短的 WAV 测试音，不访问第三方音频服务器。</p>
    <button id="audio-test-btn" type="button">测试实际 Audio 播放</button>
    <div id="audio-test-status" class="warn">尚未测试</div>
    <audio id="test-audio" controls preload="none"></audio>
  </div>

  <div class="card">
    <h2>HTTPS / 项目代理</h2>
    <p>分别测试旧浏览器能否直接读取 GitHub raw 音源，以及项目同源代理是否可用。</p>
    <button id="network-test-btn" type="button">测试 HTTPS 与项目代理</button>
    <div id="network-tests">
      <div class="row"><span class="label">GitHub raw 直连</span><span class="warn">尚未测试</span></div>
      <div class="row"><span class="label">项目 /api/proxy</span><span class="warn">尚未测试</span></div>
    </div>
  </div>

  <div class="card">
    <h2>设备信息</h2>
    <div id="device"></div>
  </div>

  <div class="card">
    <h2>项目资源</h2>
    <div id="resources"></div>
    <a href="./">打开音乐测试页</a>
  </div>

  <div class="card">
    <h2>完整报告</h2>
    <p>无法直接复制时，可以长按下面文本框并选择“全选→复制”。</p>
    <textarea id="report" readonly></textarea>
  </div>

  <script>
  (function () {
    'use strict';

    var checks = [];
    var passes = 0;
    var fails = 0;
    var warns = 0;
    var resourceResults = [];
    var RESOURCE_TIMEOUT_MS = 10000;
    var NETWORK_TIMEOUT_MS = 10000;
    var HUibq_SOURCE_URL = 'https://raw.githubusercontent.com/pdone/lx-music-source/main/huibq/latest.js';
    var networkResults = {
      direct: {state:'NOT_TESTED', detail:'尚未测试'},
      proxy: {state:'NOT_TESTED', detail:'尚未测试'}
    };
    var playbackResult = {
      state: 'NOT_TESTED',
      detail: '尚未进行实际 Audio 播放测试',
      currentTime: 0
    };

    function byId(id) { return document.getElementById(id); }

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function addCheck(name, state, detail) {
      checks.push({name:name,state:state,detail:detail});
      if (state === 'PASS') passes += 1;
      else if (state === 'FAIL') fails += 1;
      else warns += 1;
    }

    function getTotals() {
      var totalPasses = passes;
      var totalFails = fails;
      var totalWarns = warns;

      if (playbackResult.state === 'PASS') totalPasses += 1;
      else if (playbackResult.state === 'FAIL') totalFails += 1;
      else if (playbackResult.state === 'WARN') totalWarns += 1;

      if (networkResults.direct.state === 'PASS') totalPasses += 1;
      else if (networkResults.direct.state === 'FAIL') totalFails += 1;
      else if (networkResults.direct.state === 'WARN') totalWarns += 1;

      if (networkResults.proxy.state === 'PASS') totalPasses += 1;
      else if (networkResults.proxy.state === 'FAIL') totalFails += 1;
      else if (networkResults.proxy.state === 'WARN') totalWarns += 1;

      return {
        passes: totalPasses,
        warns: totalWarns,
        fails: totalFails
      };
    }

    function renderSummary() {
      var totals = getTotals();
      var summaryClass = totals.fails ? 'fail' : (totals.warns ? 'warn' : 'pass');
      var suffix = [];
      if (playbackResult.state === 'NOT_TESTED') suffix.push('实际音频');
      if (networkResults.direct.state === 'NOT_TESTED' || networkResults.proxy.state === 'NOT_TESTED') suffix.push('网络层');

      byId('summary').innerHTML =
        '<span class="' + summaryClass + '">' +
        'PASS ' + totals.passes + ' / WARN ' + totals.warns + ' / FAIL ' + totals.fails +
        '</span>' + (suffix.length ? '（' + suffix.join('、') + '尚未测试）' : '') +
        (totals.fails ? '：存在需要优先处理的兼容问题。' :
          (totals.warns ? '：基础能力基本可用，但有部分能力需要真机确认。' :
            '：当前已测试项目全部通过。'));
    }

    function safeTest(fn) {
      try { return fn(); }
      catch (e) { return false; }
    }

    addCheck('JavaScript 基础',
      typeof window === 'object' && typeof document === 'object' ? 'PASS' : 'FAIL',
      'window/document 可用');

    var eventOk = safeTest(function () {
      if (typeof window.addEventListener !== 'function' ||
          typeof window.removeEventListener !== 'function') return false;
      var target = document.createElement('button');
      var fired = false;
      function handler() { fired = true; }
      target.addEventListener('click', handler, false);
      if (typeof target.click === 'function') {
        target.click();
      } else if (typeof document.createEvent === 'function') {
        var event = document.createEvent('MouseEvents');
        event.initMouseEvent('click', true, true, window, 1, 0, 0, 0, 0, false, false, false, false, 0, null);
        target.dispatchEvent(event);
      } else {
        target.removeEventListener('click', handler, false);
        return false;
      }
      target.removeEventListener('click', handler, false);
      return fired;
    });
    addCheck('addEventListener', eventOk ? 'PASS' : 'FAIL',
      eventOk ? '事件绑定、触发与移除测试通过' : '事件机制不可正常工作');

    var storageOk = safeTest(function () {
      var key = '__legacy_test__';
      window.localStorage.setItem(key, 'ok');
      var value = window.localStorage.getItem(key);
      window.localStorage.removeItem(key);
      return value === 'ok';
    });
    addCheck('localStorage', storageOk ? 'PASS' : 'FAIL', '读写测试');

    var eventFactoryOk = safeTest(function () {
      if (typeof document.createEvent !== 'function') return false;
      var target = document.createElement('div');
      if (!target || typeof target.dispatchEvent !== 'function') return false;
      var fired = false;
      target.addEventListener('lx-test', function () {
        fired = true;
      }, false);
      var event = document.createEvent('Event');
      if (!event || typeof event.initEvent !== 'function') return false;
      event.initEvent('lx-test', true, true);
      target.dispatchEvent(event);
      return fired;
    });
    addCheck('DOM Event 创建/派发', eventFactoryOk ? 'PASS' : 'WARN',
      eventFactoryOk ? 'createEvent / initEvent / dispatchEvent 测试通过' : '旧浏览器事件创建或派发能力不可用');

    var jsonOk = safeTest(function () {
      if (!window.JSON ||
          typeof window.JSON.parse !== 'function' ||
          typeof window.JSON.stringify !== 'function') return false;
      var original = {source:'huibq', keyword:'成都', count:3};
      var textValue = window.JSON.stringify(original);
      var parsed = window.JSON.parse(textValue);
      return parsed && parsed.source === 'huibq' &&
        parsed.keyword === '成都' && parsed.count === 3;
    });
    addCheck('JSON', jsonOk ? 'PASS' : 'FAIL',
      jsonOk ? 'parse / stringify 实际测试通过' : 'JSON 解析或序列化异常');

    var promiseAvailable = typeof window.Promise === 'function';
    addCheck('Promise', promiseAvailable ? 'PASS' : 'FAIL',
      promiseAvailable ? '构造函数可用，异步执行测试随后进行' : 'Promise 不存在');
    addPendingCheck('Promise.all', '等待 Promise.all 异步测试');
    addPendingCheck('Promise.resolve/reject', '等待 Promise.resolve / reject 异步测试');

    var arrayBufferOk = safeTest(function () {
      if (typeof window.ArrayBuffer !== 'function') return false;
      var buffer = new window.ArrayBuffer(4);
      return buffer && buffer.byteLength === 4;
    });
    addCheck('ArrayBuffer', arrayBufferOk ? 'PASS' : 'FAIL',
      arrayBufferOk ? '实例化测试通过' : 'ArrayBuffer 不可正常创建');

    var uint8ArrayOk = safeTest(function () {
      if (typeof window.Uint8Array !== 'function') return false;
      var bytes = new window.Uint8Array(4);
      bytes[0] = 0x12;
      bytes[1] = 0x34;
      return bytes.length === 4 && bytes[0] === 0x12 && bytes[1] === 0x34;
    });
    addCheck('Uint8Array', uint8ArrayOk ? 'PASS' : 'FAIL',
      uint8ArrayOk ? '创建与读写测试通过' : 'Uint8Array 不可正常创建或读写');

    var dataViewOk = safeTest(function () {
      if (typeof window.ArrayBuffer !== 'function' || typeof window.DataView !== 'function') return false;
      var buffer = new window.ArrayBuffer(4);
      var view = new window.DataView(buffer);
      view.setUint16(0, 0x1234, true);
      view.setUint16(2, 0x5678, true);
      return view.byteLength === 4 && view.getUint16(0, true) === 0x1234 && view.getUint16(2, true) === 0x5678;
    });
    addCheck('DataView', dataViewOk ? 'PASS' : 'FAIL',
      dataViewOk ? '创建与读写测试通过' : 'DataView 不可正常创建或读写');

    var btoaOk = safeTest(function () {
      if (typeof window.btoa !== 'function') return false;
      return window.btoa('LX') === 'TFg=';
    });
    addCheck('btoa', btoaOk ? 'PASS' : 'FAIL',
      btoaOk ? 'Base64 编码测试通过' : 'btoa 不可正常使用');

    var uriEncodingOk = safeTest(function () {
      if (typeof window.encodeURIComponent !== 'function' ||
          typeof window.decodeURIComponent !== 'function') return false;
      var original = 'https://example.com/api?keyword=成都&level=128k';
      var encoded = window.encodeURIComponent(original);
      var decoded = window.decodeURIComponent(encoded);
      return decoded === original && encoded.indexOf('%') !== -1;
    });
    addCheck('URL 编码/解码', uriEncodingOk ? 'PASS' : 'FAIL',
      uriEncodingOk ? 'encodeURIComponent / decodeURIComponent 测试通过' : 'URL 编码函数不可正常使用');

    var objectToStringOk = safeTest(function () {
      var value = [1, 2, 3];
      return Object.prototype.toString.call(value) === '[object Array]';
    });
    addCheck('Array 类型识别', objectToStringOk ? 'PASS' : 'FAIL',
      objectToStringOk ? 'Object.prototype.toString 数组识别测试通过' : '数组类型识别异常');

    var arrayMethodOk = safeTest(function () {
      var source = [1, 2, 3];
      var sliced = source.slice(1);
      if (sliced.length !== 2 || sliced[0] !== 2 || sliced[1] !== 3) return false;
      source.splice(1, 1);
      return source.length === 2 && source[0] === 1 && source[1] === 3;
    });
    addCheck('Array slice/splice', arrayMethodOk ? 'PASS' : 'FAIL',
      arrayMethodOk ? 'slice / splice 实际操作测试通过' : '数组方法行为异常');

    var stringCoreOk = safeTest(function () {
      var value = 'LX-MUSIC-成都';
      var replaced = value.replace('MUSIC', 'TEST');
      var parts = replaced.split('-');
      return replaced === 'LX-TEST-成都' &&
        parts.length === 3 &&
        parts[1] === 'TEST' &&
        value.indexOf('MUSIC') === 3 &&
        'HeLLo'.toLowerCase() === 'hello' &&
        'hello'.toUpperCase() === 'HELLO' &&
        'abcdef'.substr(2, 2) === 'cd';
    });
    addCheck('String 核心方法', stringCoreOk ? 'PASS' : 'FAIL',
      stringCoreOk ? 'replace / split / indexOf / case / substr 测试通过' : '字符串核心方法行为异常');

    var dateNowOk = safeTest(function () {
      if (!window.Date || typeof window.Date.now !== 'function') return false;
      var before = new window.Date().getTime();
      var now = window.Date.now();
      var after = new window.Date().getTime();
      return now >= before && now <= after;
    });
    addCheck('Date.now', dateNowOk ? 'PASS' : 'FAIL',
      dateNowOk ? '当前时间戳实际测试通过' : 'Date.now 不可正常使用');

    var timerAvailable = typeof window.setTimeout === 'function' &&
      typeof window.clearTimeout === 'function';
    addCheck('setTimeout / clearTimeout', timerAvailable ? 'WARN' : 'FAIL',
      timerAvailable ? '等待异步定时器实际测试' : '定时器函数不存在');


    var urlOk = safeTest(function () {
      var testUrl = new window.URL('https://example.com/test?a=1');
      return testUrl.hostname === 'example.com' && testUrl.pathname === '/test' && testUrl.search === '?a=1';
    });
    addCheck('URL', urlOk ? 'PASS' : 'WARN',
      urlOk ? 'new URL() 实际构造测试通过' : 'URL 构造函数不可用或行为异常');

    var cryptoOk = safeTest(function () {
      if (!window.crypto || typeof window.crypto.getRandomValues !== 'function') return false;
      if (typeof window.Uint8Array !== 'function') return false;
      var bytes = new window.Uint8Array(16);
      var result = window.crypto.getRandomValues(bytes);
      return result === bytes && bytes.length === 16;
    });
    addCheck('crypto.getRandomValues', cryptoOk ? 'PASS' : 'WARN',
      cryptoOk ? '实际随机字节写入测试通过' : 'crypto.getRandomValues 不可正常使用或不存在');

    var xhrOk = safeTest(function () {
      if (typeof window.XMLHttpRequest !== 'function') return false;
      var xhr = new window.XMLHttpRequest();
      if (!xhr || typeof xhr.open !== 'function' || typeof xhr.abort !== 'function') return false;
      xhr.open('GET', window.location.href, true);
      xhr.abort();
      return true;
    });
    addCheck('XMLHttpRequest', xhrOk ? 'PASS' : 'FAIL',
      xhrOk ? '创建、open 与 abort 测试通过' : 'XMLHttpRequest 不可正常创建或操作');

    addCheck('fetch',
      typeof window.fetch === 'function' ? 'PASS' : 'WARN',
      typeof window.fetch);

    var audio = document.createElement('audio');
    addCheck('HTML5 Audio 元素',
      !!audio && typeof audio.play === 'function' ? 'PASS' : 'FAIL',
      typeof audio.play);

    var mp3 = '';
    var m4a = '';
    var ogg = '';
    if (audio && typeof audio.canPlayType === 'function') {
      mp3 = audio.canPlayType('audio/mpeg');
      m4a = audio.canPlayType('audio/mp4');
      ogg = audio.canPlayType('audio/ogg; codecs="vorbis"');
    }

    addCheck('MP3 编解码能力', mp3 ? 'PASS' : 'FAIL',
      mp3 || '浏览器未报告支持');

    addCheck('M4A 编解码能力', m4a ? 'PASS' : 'WARN',
      m4a || '浏览器未报告支持');

    addCheck('Web 项目脚本可读取',
      typeof window.XMLHttpRequest === 'function' ? 'PASS' : 'FAIL',
      '使用 XHR 检查');

    function testPromiseStaticMethods() {
      if (!promiseAvailable) return;

      try {
        if (typeof window.Promise.resolve !== 'function' || typeof window.Promise.reject !== 'function') {
          replaceCheck('Promise.resolve/reject', 'FAIL', 'Promise.resolve 或 Promise.reject 不存在');
          renderChecksOnly();
          updateReport();
          return;
        }

        var resolveOk = false;
        var rejectOk = false;
        var completed = 0;

        function finishOne() {
          completed += 1;
          if (completed !== 2) return;
          var success = resolveOk && rejectOk;
          replaceCheck(
            'Promise.resolve/reject',
            success ? 'PASS' : 'FAIL',
            success ? 'resolve / reject 实际异步测试通过' : 'resolve / reject 异步行为异常'
          );
          renderChecksOnly();
          updateReport();
        }

        window.Promise.resolve('LX').then(function (value) {
          resolveOk = value === 'LX';
          finishOne();
        }, function () {
          finishOne();
        });

        window.Promise.reject('LX').then(function () {
          finishOne();
        }, function (reason) {
          rejectOk = reason === 'LX';
          finishOne();
        });
      } catch (e) {
        replaceCheck('Promise.resolve/reject', 'FAIL', 'Promise 静态方法执行异常');
        renderChecksOnly();
        updateReport();
      }
    }

    function testTimerAsync() {
      if (!timerAvailable) return;

      var fired = false;
      var cancelled = false;
      var handle = null;

      try {
        handle = window.setTimeout(function () {
          fired = true;
        }, 0);

        if (typeof handle === 'undefined' || handle === null) {
          cancelled = true;
        }

        var cancelledHandle = window.setTimeout(function () {
          cancelled = false;
        }, 20);
        window.clearTimeout(cancelledHandle);

        window.setTimeout(function () {
          var success = fired && cancelled === false;
          replaceCheck(
            'setTimeout / clearTimeout',
            success ? 'PASS' : 'FAIL',
            success ? '定时器触发与取消测试通过' : '定时器触发或取消行为异常'
          );
          renderChecksOnly();
          updateReport();
        }, 30);
      } catch (e) {
        replaceCheck('setTimeout / clearTimeout', 'FAIL', '定时器执行异常');
        renderChecksOnly();
        updateReport();
      }
    }

    function testPromiseAll() {
      if (!promiseAvailable) return;

      var allOk = true;
      try {
        if (typeof window.Promise.all !== 'function') {
          allOk = false;
        } else {
          window.Promise.all([
            window.Promise.resolve('A'),
            window.Promise.resolve('B')
          ]).then(function (values) {
            var success = values && values.length === 2 && values[0] === 'A' && values[1] === 'B';
            replaceCheck('Promise.all', success ? 'PASS' : 'FAIL',
              success ? 'Promise.all 异步结果测试通过' : 'Promise.all 返回结果异常');
            renderChecksOnly();
            updateReport();
          }, function () {
            replaceCheck('Promise.all', 'FAIL', 'Promise.all reject');
            renderChecksOnly();
            updateReport();
          });
          return;
        }
      } catch (e) {
        allOk = false;
      }

      replaceCheck('Promise.all', allOk ? 'PASS' : 'FAIL',
        allOk ? 'Promise.all 接口可用' : 'Promise.all 不可用');
      renderChecksOnly();
      updateReport();
    }

    function addPendingCheck(name, detail) {
      checks.push({name:name,state:'WARN',detail:detail});
      warns += 1;
    }

    function testPromiseAsync() {
      if (!promiseAvailable) return;

      var settled = false;
      var value = null;
      var promiseOk = true;
      var promise = null;

      try {
        promise = new window.Promise(function (resolve) {
          resolve('LX');
        });

        if (!promise || typeof promise.then !== 'function' || typeof promise.catch !== 'function') {
          promiseOk = false;
        } else {
          promise.then(function (result) {
            value = result;
            settled = true;
          }, function () {
            promiseOk = false;
          });

          window.setTimeout(function () {
            if (settled && value === 'LX' && promiseOk) {
              replaceCheck('Promise', 'PASS', '创建、resolve 与 then 异步执行测试通过');
            } else {
              replaceCheck('Promise', 'FAIL', 'Promise 创建成功，但 then 未能正常异步执行');
            }
            renderChecksOnly();
            updateReport();
          }, 0);
          return;
        }
      } catch (e) {
        promiseOk = false;
      }

      replaceCheck('Promise', promiseOk ? 'PASS' : 'FAIL',
        promiseOk ? 'Promise 基础接口检查通过' : 'Promise 不可正常创建或使用');
      renderChecksOnly();
      updateReport();
    }

    function replaceCheck(name, state, detail) {
      for (var i = 0; i < checks.length; i += 1) {
        if (checks[i].name === name) {
          if (checks[i].state === 'PASS') passes -= 1;
          else if (checks[i].state === 'FAIL') fails -= 1;
          else warns -= 1;
          checks[i].state = state;
          checks[i].detail = detail;
          if (state === 'PASS') passes += 1;
          else if (state === 'FAIL') fails += 1;
          else warns += 1;
          return;
        }
      }
    }

    function renderChecksOnly() {
      var html = '';
      var i;
      for (i = 0; i < checks.length; i += 1) {
        html += '<div class="row"><span class="label">' + esc(checks[i].name) +
          '</span><span class="' +
          (checks[i].state === 'PASS' ? 'pass' :
            (checks[i].state === 'FAIL' ? 'fail' : 'warn')) +
          '">' + esc(checks[i].state) + '</span> <span>' +
          esc(checks[i].detail) + '</span></div>';
      }
      byId('checks').innerHTML = html;
      renderSummary();
    }

    function render() {
      var html = '';
      var i;
      for (i = 0; i < checks.length; i += 1) {
        html += '<div class="row"><span class="label">' + esc(checks[i].name) +
          '</span><span class="' +
          (checks[i].state === 'PASS' ? 'pass' :
            (checks[i].state === 'FAIL' ? 'fail' : 'warn')) +
          '">' + esc(checks[i].state) + '</span> <span>' +
          esc(checks[i].detail) + '</span></div>';
      }
      byId('checks').innerHTML = html;

      byId('device').innerHTML =
        '<div class="row"><span class="label">User Agent</span>' + esc(navigator.userAgent) + '</div>' +
        '<div class="row"><span class="label">窗口尺寸</span>' + esc(window.innerWidth) + ' × ' + esc(window.innerHeight) + '</div>' +
        '<div class="row"><span class="label">屏幕尺寸</span>' + esc(window.screen.width) + ' × ' + esc(window.screen.height) + '</div>' +
        '<div class="row"><span class="label">devicePixelRatio</span>' + esc(window.devicePixelRatio || '—') + '</div>' +
        '<div class="row"><span class="label">语言</span>' + esc(navigator.language || navigator.userLanguage || '—') + '</div>' +
        '<div class="row"><span class="label">在线状态</span>' + esc(navigator.onLine ? 'online' : 'offline') + '</div>';

      byId('resources').innerHTML =
        '<div class="row"><span class="label">MP3 canPlayType</span>' + esc(mp3 || '—') + '</div>' +
        '<div class="row"><span class="label">M4A canPlayType</span>' + esc(m4a || '—') + '</div>' +
        '<div class="row"><span class="label">OGG canPlayType</span>' + esc(ogg || '—') + '</div>' +
        '<div class="row"><span class="label">当前页面</span>' + esc(location.href) + '</div>';

      testPromiseAsync();
      testPromiseAll();
      testPromiseStaticMethods();
      testTimerAsync();
      testResource('src/lx-runtime.js');
      testResource('src/source-manager.js');
      testResource('src/music-search.js');
      renderSummary();
      updateReport();
    }

    function testResource(path) {
      if (typeof window.XMLHttpRequest !== 'function') return;

      var xhr = new XMLHttpRequest();
      var finished = false;
      var timer = null;

      function finish(state, status) {
        if (finished) return;
        finished = true;
        if (timer) window.clearTimeout(timer);

        resourceResults.push({path:path,status:status,state:state});
        var existing = byId('resources').innerHTML;
        byId('resources').innerHTML = existing +
          '<div class="row"><span class="label">' + esc(path) +
          '</span><span class="' + (state === 'PASS' ? 'pass' : (state === 'WARN' ? 'warn' : 'fail')) + '">' +
          state + '</span> ' + (status === 'TIMEOUT' ? '超时（' + RESOURCE_TIMEOUT_MS + 'ms）' : 'HTTP ' + esc(status)) + '</div>';
        updateReport();
        try { xhr.abort(); } catch (e) {}
      }

      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4 || finished) return;
        if (xhr.status >= 200 && xhr.status < 300) finish('PASS', xhr.status);
        else finish('FAIL', xhr.status);
      };
      xhr.onerror = function () { finish('FAIL', 'network-error'); };

      timer = window.setTimeout(function () {
        finish('WARN', 'TIMEOUT');
      }, RESOURCE_TIMEOUT_MS);

      try {
        xhr.open('GET', path, true);
        xhr.send(null);
      } catch (e) {
        finish('FAIL', 'send-error');
      }
    }

    function renderNetwork() {
      var html = '';
      var items = [
        {label:'GitHub raw 直连', result:networkResults.direct},
        {label:'项目 /api/proxy', result:networkResults.proxy}
      ];
      for (var i = 0; i < items.length; i += 1) {
        var item = items[i];
        var cls = item.result.state === 'PASS' ? 'pass' : (item.result.state === 'FAIL' ? 'fail' : 'warn');
        html += '<div class="row"><span class="label">' + esc(item.label) + '</span>' +
          '<span class="' + cls + '">' + esc(item.result.state) + '</span> ' +
          esc(item.result.detail) + '</div>';
      }
      byId('network-tests').innerHTML =
        '<button id="network-test-btn" type="button">重新测试 HTTPS 与项目代理</button>' + html;
      byId('network-test-btn').onclick = testNetwork;
    }

    function runNetworkTest(url, onResult) {
      if (typeof window.XMLHttpRequest !== 'function') {
        onResult('FAIL', 'XMLHttpRequest 不存在。');
        return;
      }

      var xhr = new XMLHttpRequest();
      var finished = false;
      var timer = null;

      function finish(state, detail) {
        if (finished) return;
        finished = true;
        if (timer) window.clearTimeout(timer);
        onResult(state, detail);
        try { xhr.abort(); } catch (e) {}
      }

      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4 || finished) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          finish('PASS', 'HTTP ' + xhr.status + '，可读取。');
        } else {
          finish('FAIL', 'HTTP ' + xhr.status + '。');
        }
      };
      xhr.onerror = function () { finish('FAIL', '浏览器网络请求失败（可能是 HTTPS / CORS / TLS）。'); };

      timer = window.setTimeout(function () {
        finish('WARN', '请求超时（' + NETWORK_TIMEOUT_MS + 'ms）。');
      }, NETWORK_TIMEOUT_MS);

      try {
        xhr.open('GET', url, true);
        xhr.send(null);
      } catch (e) {
        finish('FAIL', 'XHR 发送失败：' + (e.message || e));
      }
    }

    function testNetwork() {
      networkResults.direct = {state:'WARN', detail:'正在测试 GitHub raw 直连……'};
      networkResults.proxy = {state:'WARN', detail:'正在测试项目代理……'};
      renderNetwork();
      updateReport();

      runNetworkTest(HUibq_SOURCE_URL, function (state, detail) {
        networkResults.direct = {state:state, detail:detail};
        renderNetwork();
        updateReport();
        runNetworkTest('/api/proxy?url=' + encodeURIComponent(HUibq_SOURCE_URL), function (proxyState, proxyDetail) {
          networkResults.proxy = {state:proxyState, detail:proxyDetail};
          renderNetwork();
          updateReport();
        });
      });
    }

    function writeAscii(view, offset, text) {
      var i;
      for (i = 0; i < text.length; i += 1) view.setUint8(offset + i, text.charCodeAt(i) & 255);
    }

    function makeWavDataUri() {
      var sampleRate = 8000;
      var seconds = 0.4;
      var sampleCount = Math.floor(sampleRate * seconds);
      var bytesPerSample = 2;
      var buffer = new ArrayBuffer(44 + sampleCount * bytesPerSample);
      var view = new DataView(buffer);
      var i;
      var sample;
      var amplitude = 5000;

      writeAscii(view, 0, 'RIFF');
      view.setUint32(4, 36 + sampleCount * bytesPerSample, true);
      writeAscii(view, 8, 'WAVE');
      writeAscii(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * bytesPerSample, true);
      view.setUint16(32, bytesPerSample, true);
      view.setUint16(34, 16, true);
      writeAscii(view, 36, 'data');
      view.setUint32(40, sampleCount * bytesPerSample, true);

      for (i = 0; i < sampleCount; i += 1) {
        sample = Math.round(amplitude * Math.sin(2 * Math.PI * 440 * i / sampleRate));
        view.setInt16(44 + i * 2, sample, true);
      }

      var binary = '';
      var bytes = new Uint8Array(buffer);
      for (i = 0; i < bytes.length; i += 1) {
        binary += String.fromCharCode(bytes[i]);
      }

      if (typeof window.btoa !== 'function') return null;
      return 'data:audio/wav;base64,' + window.btoa(binary);
    }

    function setPlaybackStatus(state, detail) {
      playbackResult.state = state;
      playbackResult.detail = detail;
      playbackResult.currentTime = 0;

      var cls = state === 'PASS' ? 'pass' : (state === 'FAIL' ? 'fail' : 'warn');
      byId('audio-test-status').className = cls;
      byId('audio-test-status').innerHTML = esc(detail);
      renderSummary();
      updateReport();
    }

    function testActualPlayback() {
      var target = byId('test-audio');
      var src = makeWavDataUri();
      var finished = false;
      var timer;

      if (!target || typeof target.play !== 'function') {
        setPlaybackStatus('FAIL', 'Audio.play 不存在，无法进行实际播放测试。');
        return;
      }

      if (!src) {
        setPlaybackStatus('FAIL', '浏览器缺少 btoa，无法生成本地测试音频。');
        return;
      }

      function finish(state, detail) {
        if (finished) return;
        finished = true;
        window.clearTimeout(timer);
        playbackResult.currentTime = Number(target.currentTime || 0);
        setPlaybackStatus(state, detail);
      }

      target.onplaying = function () {
        if (Number(target.currentTime || 0) > 0.05 || target.readyState >= 3) {
          finish('PASS', '实际 Audio 播放已开始，currentTime=' + Number(target.currentTime || 0).toFixed(3) + ' 秒。');
        }
      };
      target.ontimeupdate = function () {
        if (Number(target.currentTime || 0) > 0.05) {
          finish('PASS', '实际 Audio 播放已开始，currentTime=' + Number(target.currentTime || 0).toFixed(3) + ' 秒。');
        }
      };
      target.onerror = function () {
        finish('FAIL', '实际 Audio 播放失败，浏览器报告 media error。');
      };

      timer = window.setTimeout(function () {
        finish('FAIL', '点击测试后 5 秒内未观察到实际播放进度。');
      }, 5000);

      try {
        target.src = src;
        target.load();
        var result = target.play();
        if (result && typeof result.catch === 'function') {
          result.catch(function () {
            finish('WARN', '浏览器拒绝自动播放；请直接点击播放器的播放按钮再测试。');
          });
        }
      } catch (e) {
        finish('WARN', '浏览器未能自动播放；请直接点击播放器的播放按钮再测试。');
      }
    }

    function buildReport() {
      var lines = [];
      var i;
      var totals = getTotals();
      lines.push('Only-testing-online-music Android 4.4 / Via 自检报告');
      lines.push('时间：' + new Date().toString());
      lines.push('');
      lines.push('汇总：PASS ' + totals.passes + ' / WARN ' + totals.warns + ' / FAIL ' + totals.fails);
      lines.push('');
      lines.push('[基础能力]');
      for (i = 0; i < checks.length; i += 1) {
        lines.push(checks[i].state + ' | ' + checks[i].name + ' | ' + checks[i].detail);
      }
      lines.push('');
      lines.push('[实际音频播放]');
      lines.push(playbackResult.state + ' | ' + playbackResult.detail);
      lines.push('currentTime: ' + playbackResult.currentTime);
      lines.push('');
      lines.push('[HTTPS / 项目代理]');
      lines.push('GitHub raw 直连: ' + networkResults.direct.state + ' | ' + networkResults.direct.detail);
      lines.push('项目 /api/proxy: ' + networkResults.proxy.state + ' | ' + networkResults.proxy.detail);
      lines.push('');
      lines.push('[设备信息]');
      lines.push('User Agent: ' + navigator.userAgent);
      lines.push('窗口尺寸: ' + window.innerWidth + ' x ' + window.innerHeight);
      lines.push('屏幕尺寸: ' + window.screen.width + ' x ' + window.screen.height);
      lines.push('devicePixelRatio: ' + (window.devicePixelRatio || '—'));
      lines.push('语言: ' + (navigator.language || navigator.userLanguage || '—'));
      lines.push('在线状态: ' + (navigator.onLine ? 'online' : 'offline'));
      lines.push('');
      lines.push('[媒体能力]');
      lines.push('MP3 canPlayType: ' + (mp3 || '—'));
      lines.push('M4A canPlayType: ' + (m4a || '—'));
      lines.push('OGG canPlayType: ' + (ogg || '—'));
      lines.push('');
      lines.push('[项目资源]');
      if (!resourceResults.length) {
        lines.push('检测尚未完成');
      } else {
        for (i = 0; i < resourceResults.length; i += 1) {
          lines.push(resourceResults[i].state + ' | ' + resourceResults[i].path + ' | ' + resourceResults[i].status);
        }
      }
      lines.push('');
      lines.push('页面：' + location.href);
      return lines.join('\n');
    }

    function updateReport() {
      byId('report').value = buildReport();
    }

    function copyText(textValue, successText) {
      var area = byId('report');
      var status = byId('copy-status');
      area.value = textValue;
      area.focus();
      area.select();
      area.selectionStart = 0;
      area.selectionEnd = area.value.length;

      var ok = false;
      try {
        if (document.execCommand) ok = document.execCommand('copy');
      } catch (e) {
        ok = false;
      }

      if (ok) {
        status.innerHTML = successText;
        status.className = 'pass';
      } else {
        status.innerHTML = '自动复制失败，请长按下面“完整报告”文本框，选择全选→复制。';
        status.className = 'warn';
      }
    }

    function copyReport() {
      copyText(buildReport(), '已复制完整报告，请直接粘贴回来。');
      updateReport();
    }

    function buildShortReport() {
      var totals = getTotals();
      var lines = [];
      lines.push('Only-testing-online-music Android 4.4 / Via 精简报告');
      lines.push('汇总：PASS ' + totals.passes + ' / WARN ' + totals.warns + ' / FAIL ' + totals.fails);
      lines.push('User Agent: ' + navigator.userAgent);
      lines.push('屏幕：' + window.screen.width + ' x ' + window.screen.height);
      lines.push('窗口：' + window.innerWidth + ' x ' + window.innerHeight);
      lines.push('MP3: ' + (mp3 || '—'));
      lines.push('M4A: ' + (m4a || '—'));
      lines.push('实际 Audio：' + playbackResult.state + ' | ' + playbackResult.detail);
      lines.push('GitHub raw 直连：' + networkResults.direct.state + ' | ' + networkResults.direct.detail);
      lines.push('项目代理：' + networkResults.proxy.state + ' | ' + networkResults.proxy.detail);
      if (resourceResults.length) {
        for (var i = 0; i < resourceResults.length; i += 1) {
          lines.push('资源 ' + resourceResults[i].path + '：' + resourceResults[i].state + ' / ' + resourceResults[i].status);
        }
      } else {
        lines.push('项目资源：尚未完成');
      }
      lines.push('页面：' + location.href);
      return lines.join('\n');
    }

    function copyShortReport() {
      copyText(buildShortReport(), '已复制精简报告，请直接粘贴回来。');
    }

    byId('copy-btn').onclick = copyReport;
    byId('copy-short-btn').onclick = copyShortReport;
    byId('network-test-btn').onclick = testNetwork;
    byId('audio-test-btn').onclick = testActualPlayback;

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', render, false);
    } else {
      render();
    }
  }());
  </script>
