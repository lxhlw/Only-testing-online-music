name: Android 4.4 Native Companion APK

on:
  pull_request:
    paths:
      - 'android-app/**'
      - 'src/android-native-media.js'
      - 'src/app.js'
      - 'index.html'
      - 'scripts/test-android19-native-bridge-browser.mjs'
      - '.github/workflows/android-legacy-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'src/android-native-media.js'
      - 'src/app.js'
      - 'index.html'
      - '.github/workflows/android-legacy-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android19-apk:
    name: Build installable API 19 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 required by current Android SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 33 compilation platform
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.2'
      - name: Java 11 for Android Gradle Plugin 7.4 build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Run Android JVM unit tests and compile APK
        run: gradle -p android-app --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify API 19 install compatibility and APK exists
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/33.0.2/aapt dump badging android-app/app/build/outputs/apk/debug/app-debug.apk | grep "sdkVersion:'19'"
          $ANDROID_HOME/build-tools/33.0.2/aapt dump badging android-app/app/build/outputs/apk/debug/app-debug.apk | grep "targetSdkVersion:'28'"
      - name: Upload debug APK for physical Android 4.4.2 test
        uses: actions/upload-artifact@v4
        with:
          name: LXMusic-Android4.4-Native-Companion-Debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
