name: FyMusic · UI2 Atmosphere design candidate
on:
  push:
    branches: [design/fymusic-ui2-atmosphere-20261104]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fymusic-ui2-atmosphere-20261104
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test version, theme, privacy, route allowlist
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/design/fymusic-ui2-atmosphere-20261104
          npm install --no-audit --no-fund
          node --check src/player-controls.js
          node --check src/ui2-preview.js
          node --check src/ui2-audio-visualizer.js
          node --check scripts/test-ui2-default-browser.mjs
          node scripts/test-version.mjs
          node scripts/test-ui2-contract.mjs
          node scripts/test-ui2-phase2-style.mjs
          node scripts/test-ui2-atmosphere-style.mjs
          node scripts/check-handoff-privacy.mjs
          node scripts/test-migu-lyrics-endpoint.mjs
          node scripts/build-pages-dist.mjs
          node scripts/test-pages-dist.mjs
          node scripts/test-pages-route-guard.mjs
          npx playwright install --with-deps chromium webkit
      - name: Local Chromium and WebKit default, classic and player tests
        run: |
          set -euo pipefail
          npx wrangler pages dev dist --ip 127.0.0.1 --port 8788 >/tmp/fymusic-ui2-default.log 2>&1 &
          ready=0
          for i in {1..50}; do
            if curl -fsSL http://127.0.0.1:8788/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if test "$ready" != 1; then cat /tmp/fymusic-ui2-default.log; exit 1; fi
          node scripts/test-ui2-default-browser.mjs
          node scripts/test-ui2-atmosphere-browser.mjs
          node scripts/test-ui2-desktop-browser.mjs
          node scripts/test-ui2-visualizer-browser.mjs
          node scripts/test-ui2-theme-browser.mjs
          node scripts/test-ui2-touch-reachability-browser.mjs
          node scripts/test-modern-web-browser.mjs
          node scripts/test-seamless-cross-platform-browser.mjs
      - name: Deploy isolated Cloudflare preview, never production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler pages deploy dist --project-name only-testing-online-music --branch fymusic-ui2-atmosphere-rc --commit-hash "$GITHUB_SHA" | tee /tmp/fymusic-default-deploy.log
          url=$(grep -Eo 'https://[0-9a-f]{8}\.only-testing-online-music\.pages\.dev' /tmp/fymusic-default-deploy.log | head -n1)
          test -n "$url"
          test "$url" != https://only-testing-online-music.pages.dev
          echo "TEST_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "FYMUSIC_UI2_ATMOSPHERE_RC_URL=$url/"
      - name: Verify immutable Preview version and protected assets, both UI modes
        run: |
          set -euo pipefail
          # Bounded readiness for transient Cloudflare Preview HTTP 500.
          # Continue only on HTTP 200; all real music gates remain strict.
          homepage_ready=0
          for attempt in {1..12}; do
            code=$(curl -sSL --max-time 12 -o /tmp/ui2-default-index.html -w '%{http_code}' "$TEST_BASE_URL/" || true)
            if test "$code" = 200; then homepage_ready=1; break; fi
            sleep 2
          done
          test "$homepage_ready" = 1
          expected_version=$(node -p "JSON.parse(require('node:fs').readFileSync('version.json','utf8')).version")
          grep -Fq "id=\"app-version\">v${expected_version}<" /tmp/ui2-default-index.html
          grep -Fq "ui2-preview.css?v=${expected_version}" /tmp/ui2-default-index.html
          grep -Fq "src/app-version.js?v=${expected_version}" /tmp/ui2-default-index.html
          code=$(curl -sSL -o /tmp/ui2-default-guard -w '%{http_code}' "$TEST_BASE_URL/README.md")
          test "$code" = 404
          node scripts/test-ui2-default-browser.mjs
          node scripts/test-ui2-atmosphere-browser.mjs
          node scripts/test-ui2-theme-browser.mjs
          node scripts/test-ui2-touch-reachability-browser.mjs
          node scripts/test-seamless-cross-platform-browser.mjs
      - name: Strict real original song Kugou to Kuwo fallback
        run: node scripts/test-seamless-live-daoxiang-preview.mjs
      - name: Strict original Migu real timed lyrics and media playback
        if: always()
        run: |
          test -n "$TEST_BASE_URL"
          node scripts/test-migu-lyrics-preview-live.mjs
      - name: Preserve sanitized Atmosphere design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fymusic-ui2-atmosphere-visual
          path: .artifacts/ui2-atmosphere
          if-no-files-found: ignore
          retention-days: 7
      - name: Preview must not deploy the official site
        if: always()
        run: echo FYMUSIC_UI2_ATMOSPHERE_RC_NOT_PRODUCTION
