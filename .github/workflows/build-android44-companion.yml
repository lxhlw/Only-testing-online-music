name: Build Android 4.4 Native Companion APK

on:
  pull_request:
    paths:
      - 'android-companion/**'
      - 'scripts/test-android44-native-resolver-browser.mjs'
      - 'scripts/test-android44-native-media-url-browser.mjs'
      - 'scripts/test-resolver-outage-cooldown-browser.mjs'
      - 'scripts/test-android44-flower-optin-retry-browser.mjs'
      - 'scripts/test-android44-flower-init-race-browser.mjs'
      - 'scripts/test-android44-fast-clean-browser.mjs'
      - 'scripts/bundle-android44-webui.mjs'
      - 'scripts/test-android44-apk-babel-offline-browser.mjs'
      - 'scripts/diagnose-android44-babel-runtime.mjs'
      - 'scripts/test-chrome30-strict-syntax.mjs'
      - 'package.json'
      - 'scripts/test-android44-bundled-ui-browser.mjs'
      - 'styles.css'
      - 'src/**'
      - 'vendor/forge.min.js'
      - 'scripts/test-android44-modern-trust.mjs'
      - 'src/android-native-xhr-fallback.js'
      - 'scripts/test-android44-bundled-fallback-browser.mjs'
      - 'src/app.js'
      - 'index.html'
      - 'scripts/test-native-companion-browser.mjs'
      - '.github/workflows/build-android44-companion.yml'
  push:
    branches: [main]
    paths:
      - 'android-companion/**'
      - 'scripts/test-chrome30-strict-syntax.mjs'
      - 'package.json'
      - 'src/**'
      - 'styles.css'
      - 'vendor/forge.min.js'
      - 'src/android-native-xhr-fallback.js'
      - 'scripts/test-android44-bundled-fallback-browser.mjs'
      - 'src/app.js'
      - 'index.html'
      - 'scripts/test-native-companion-browser.mjs'
      - '.github/workflows/build-android44-companion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android API 19 installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled runner SDK and install API 35
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate modern CA anchors and strict TLS wiring
        run: node scripts/test-android44-modern-trust.mjs
      - name: Install strict ES5 script parser
        run: npm install --no-audit --no-fund
      - name: Check opt-in Flower retry test syntax
        run: |
          node --check scripts/test-android44-flower-optin-retry-browser.mjs
          node --check scripts/test-android44-flower-init-race-browser.mjs
          node --check scripts/test-android44-fast-clean-browser.mjs
      - name: Check upstream service outage test syntax
        run: node --check scripts/test-resolver-outage-cooldown-browser.mjs
      - name: Check actual native media URL regression syntax
        run: node --check scripts/test-android44-native-media-url-browser.mjs
      - name: Check native resolver bridge test syntax
        run: node --check scripts/test-android44-native-resolver-browser.mjs
      - name: Verify all UI scripts parse on Android Chrome 30
        run: node scripts/test-chrome30-strict-syntax.mjs
      - name: Check offline Babel regression syntax
        run: node --check scripts/test-android44-apk-babel-offline-browser.mjs
      - name: Bundle matching website UI and core scripts in APK
        run: node scripts/bundle-android44-webui.mjs
      - name: Diagnose APK Babel syntax on Chrome 30
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {parse} from 'acorn'; const s=readFileSync('android-companion/app/src/main/assets/web/vendor/babel.min.js','utf8'); try {parse(s,{ecmaVersion:5,sourceType:'script'});console.log('BABEL_CHROME30_ES5_PASS '+s.length)} catch(e) {console.error('BABEL_CHROME30_ES5_FAIL '+e.message);process.exitCode=1;}"
      - name: Require Babel conversion with missing Chrome30 native ES6 APIs
        run: node scripts/diagnose-android44-babel-runtime.mjs
      - name: Install Chromium for full offline Flower import regression
        run: npx playwright install chromium
      - name: Verify APK polyfills + offline Babel + LX musicUrl with /api/babel HTTP 503
        run: |
          set -euo pipefail
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/lx-apk-wrangler.log 2>&1 &
          READY=0
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8788/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then cat /tmp/lx-apk-wrangler.log; exit 1; fi
          node scripts/test-android44-apk-babel-offline-browser.mjs
          node scripts/test-android44-flower-init-race-browser.mjs
          node scripts/test-android44-fast-clean-browser.mjs
      - name: Build signed debug APK
        run: gradle --no-daemon -p android-companion :app:testDebugUnitTest :app:assembleDebug
      - name: Check APK existence and min SDK
        run: |
          test -s android-companion/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-companion/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-companion/app/build/outputs/apk/debug/app-debug.apk | grep "sdkVersion:'19'"
      - name: Ensure APK contains the full pinned UI bundle
        run: |
          set -euo pipefail
          APK="android-companion/app/build/outputs/apk/debug/app-debug.apk"
          for FILE in assets/web/index.html assets/web/styles.css assets/web/src/app.js assets/web/src/source-manager.js assets/web/vendor/forge.min.js assets/web/vendor/babel.min.js assets/web/vendor/core-js.min.js; do
            unzip -Z -1 "$APK" | grep -Fx "$FILE"
          done
      - name: Give APK a distinct versioned filename
        run: |
          set -euo pipefail
          ORIGINAL="android-companion/app/build/outputs/apk/debug/app-debug.apk"
          NAMED="android-companion/LXMusic-Android44-v0.16-FastClean.apk"
          cp "$ORIGINAL" "$NAMED"
          cmp "$ORIGINAL" "$NAMED"
          sha256sum "$NAMED"
      - name: Upload named installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LXMusic-Android44-v0.16-FastClean
          path: android-companion/LXMusic-Android44-v0.16-FastClean.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable versioned APK filename on GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android44-fast-clean-v016-20261028"
          NAMED_APK="android-companion/LXMusic-Android44-v0.16-FastClean.apk"
          FRIENDLY_NAME="LXMusic-Android44-v0.16-FastClean.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$NAMED_APK" \
              --target "$GITHUB_SHA" \
              --title "LX Music Android 4.4 - Faster 16s parallel song resolving + clean native player beta 0.16" \
              --notes "Android 4.4 API19 beta v0.16 races existing same-platform resolvers in parallel after 2s Flower delay and caps automatic stalls at 21s; offers opt-in full slower resolver if no playable URL. Hides old test controls and legacy HTML5 player only inside APK and binds mint Play button to native bridge. Retains strict HTTPS, previous working full-download playback, and clear diagnostics. Keeps explicit opt-in Flower retry, strict native HTTPS and proven native sound playback. Must test actual Flower initialization and music on L101. Debug prerelease." \
              --prerelease
          else
            # Repair the previously published Release asset *in place*. Only
            # rename its metadata; do not replace the existing signed APK
            # with a newly built one (which may have a different debug key).
            EXISTING_NAME="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$EXISTING_NAME" | grep -Fxq "$FRIENDLY_NAME"; then
              echo "Versioned filename already present."
            elif printf '%s\n' "$EXISTING_NAME" | grep -Fxq 'app-debug.apk'; then
              ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                --jq '.assets[] | select(.name=="app-debug.apk") | .id')"
              test -n "$ASSET_ID"
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
                -f "name=$FRIENDLY_NAME" --silent
              echo "Renamed existing Release asset without changing APK bytes."
            else
              echo "::error::Existing Release has neither expected asset name."
              exit 1
            fi
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$FRIENDLY_NAME"
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq 'app-debug.apk'; then
            echo "::error::Legacy unversioned name is still exposed."
            exit 1
          fi
