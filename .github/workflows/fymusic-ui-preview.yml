name: FyMusic Phase 8 - Smooth UI Isolated Preview
on:
  push:
    branches: [feature/fymusic-playback-verifier]
    paths:
      - '.github/workflows/fymusic-ui-preview.yml'
      - 'src/modern-ui.js'
      - 'src/mobile-shell.js'
      - 'src/mobile-shell.css'
      - 'scripts/test-fymusic-modern-mobile-a11y.mjs'
      - 'src/now-playing-experience.js'
      - 'src/player-controls.js'
      - 'scripts/test-fymusic-immersive-mobile-seek.mjs'
      - 'scripts/test-fymusic-foreground-lifecycle-browser.mjs'
      - 'scripts/test-fymusic-media-session-browser.mjs'
      - 'scripts/test-fymusic-fast-track-metadata-browser.mjs'
      - 'scripts/test-fymusic-cover-error-resource-stress.mjs'
      - 'scripts/test-fymusic-long-session-memory-browser.mjs'
      - 'scripts/test-fymusic-weak-network-recovery-browser.mjs'
      - 'scripts/test-fymusic-real-media-lifecycle-browser.mjs'
      - 'scripts/test-fymusic-range-stream-recovery-browser.mjs'
      - 'scripts/test-fymusic-throttled-buffering-browser.mjs'
      - 'scripts/test-fymusic-mse-starvation-browser.mjs'
      - 'scripts/test-fymusic-direct-progressive-browser.mjs'
      - 'scripts/test-fymusic-primed-direct-browser.mjs'
      - 'scripts/test-fymusic-phase22-lead-browser.mjs'
      - 'scripts/test-fymusic-phase23-range-compare-browser.mjs'
      - 'scripts/test-fymusic-phase24-repeated-range-browser.mjs'
      - 'scripts/test-fymusic-phase25-codecs-browser.mjs'
      - 'scripts/test-fymusic-phase26-metadata-hires-browser.mjs'
      - 'scripts/test-fymusic-phase27-real-ui-state-browser.mjs'
      - 'scripts/test-fymusic-phase28-quality-platform-os-browser.mjs'
      - 'scripts/test-fymusic-phase29-real-tab-lifecycle-browser.mjs'
      - 'scripts/test-fymusic-phase30-raw-cdp-real-hidden.mjs'
      - 'scripts/test-fymusic-phase31-seek-state-browser.mjs'
      - 'scripts/test-fymusic-phase32-real-seek-ownership-browser.mjs'
      - 'scripts/test-fymusic-phase33-native-touch-seek-browser.mjs'
      - 'scripts/test-fymusic-phase34-raw-cdp-background-gesture.mjs'
      - 'scripts/test-fymusic-phase35-raw-cdp-mobile-background-touch.mjs'
      - 'scripts/test-fymusic-phase36-native-touch-os-track-browser.mjs'
      - 'scripts/test-fymusic-phase33-native-mouse-seek-browser.mjs'
      - 'scripts/generate-fymusic-phase26-fixtures.mjs'
      - 'scripts/generate-fymusic-phase25-fixtures.mjs'
      - 'functions/api/fymusic-codec-selftest.js'
      - 'src/fymusic-media-evidence.js'
      - 'functions/api/fymusic-range-selftest.js'
      - 'functions/api/fymusic-throttle-selftest.js'
      - 'src/music-lyrics.js'
      - 'scripts/test-fymusic-long-list-lyrics-browser.mjs'
      - 'scripts/test-fymusic-playlist-incremental-browser.mjs'
      - 'scripts/test-fymusic-frame-coherence-browser.mjs'
      - 'scripts/diagnostics/fymusic-startup-profile.mjs'
      - 'index.html'
      - 'modern.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fymusic-isolated-edge-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-preview:
    if: github.ref == 'refs/heads/feature/fymusic-playback-verifier'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: only-testing-online-music
      PREVIEW_BRANCH: feature/fymusic-playback-verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hard guard against a production deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$PREVIEW_BRANCH"
          test "$PREVIEW_BRANCH" != "main"
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'FYMUSIC_PREVIEW_SECRETS_UNAVAILABLE'
            exit 1
          fi
          if ! curl -fsS --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o /tmp/fymusic-project-metadata.json; then
            echo 'FYMUSIC_PREVIEW_PROJECT_QUERY_FAILED'
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/fymusic-project-metadata.json','utf8'));
          if(data.success!==true || data.result?.production_branch!=='main'){
            console.error('FYMUSIC_PREVIEW_GUARD_STOP: production branch not verified as main');
            process.exit(1);
          }
          console.log('FYMUSIC_PREVIEW_GUARD_PASS production_branch=main');
          NODE
      - name: Install existing project dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check modern UI and browser evidence
        run: |
          node --check src/modern-ui.js
          node --check src/mobile-shell.js
          node --check scripts/test-fymusic-modern-mobile-a11y.mjs
          node --check src/now-playing-experience.js
          node --check src/player-controls.js
          node --check scripts/test-fymusic-immersive-mobile-seek.mjs
          node --check scripts/test-fymusic-foreground-lifecycle-browser.mjs
          node --check scripts/test-fymusic-media-session-browser.mjs
          node --check scripts/test-fymusic-fast-track-metadata-browser.mjs
          node --check scripts/test-fymusic-cover-error-resource-stress.mjs
          node --check scripts/test-fymusic-long-session-memory-browser.mjs
          node --check scripts/test-fymusic-weak-network-recovery-browser.mjs
          node --check scripts/test-fymusic-real-media-lifecycle-browser.mjs
          node --check scripts/test-fymusic-range-stream-recovery-browser.mjs
          node --check scripts/test-fymusic-throttled-buffering-browser.mjs
          node --check scripts/test-fymusic-mse-starvation-browser.mjs
          node --check scripts/test-fymusic-direct-progressive-browser.mjs
          node --check scripts/test-fymusic-primed-direct-browser.mjs
          node --check scripts/test-fymusic-phase22-lead-browser.mjs
          node --check scripts/test-fymusic-phase23-range-compare-browser.mjs
          node --check scripts/test-fymusic-phase24-repeated-range-browser.mjs
          node --check scripts/test-fymusic-phase25-codecs-browser.mjs
          node --check scripts/test-fymusic-phase26-metadata-hires-browser.mjs
          node --check scripts/test-fymusic-phase27-real-ui-state-browser.mjs
          node --check scripts/test-fymusic-phase28-quality-platform-os-browser.mjs
          node --check scripts/test-fymusic-phase29-real-tab-lifecycle-browser.mjs
          node --check scripts/test-fymusic-phase30-raw-cdp-real-hidden.mjs
          node --check scripts/test-fymusic-phase31-seek-state-browser.mjs
          node --check scripts/test-fymusic-phase32-real-seek-ownership-browser.mjs
          node --check scripts/test-fymusic-phase33-native-touch-seek-browser.mjs
          node --check scripts/test-fymusic-phase34-raw-cdp-background-gesture.mjs
          node --check scripts/test-fymusic-phase35-raw-cdp-mobile-background-touch.mjs
          node --check scripts/test-fymusic-phase36-native-touch-os-track-browser.mjs
          node --check scripts/test-fymusic-phase33-native-mouse-seek-browser.mjs
          node --check scripts/generate-fymusic-phase26-fixtures.mjs
          node --check scripts/generate-fymusic-phase25-fixtures.mjs
          node --check functions/api/fymusic-codec-selftest.js
          node --check src/fymusic-media-evidence.js
          node --check functions/api/fymusic-range-selftest.js
          node --check functions/api/fymusic-throttle-selftest.js
          node --check src/music-lyrics.js
          node --check scripts/test-fymusic-long-list-lyrics-browser.mjs
          node --check scripts/test-fymusic-playlist-incremental-browser.mjs
          node --check scripts/test-fymusic-frame-coherence-browser.mjs
          node --check scripts/diagnostics/fymusic-startup-profile.mjs
      - name: Generate original MP3 AAC-LC and FLAC test assets for isolated QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
          node scripts/generate-fymusic-phase25-fixtures.mjs
      - name: Generate isolated original hi-res and metadata audio fixtures
        run: node scripts/generate-fymusic-phase26-fixtures.mjs
      - name: Deploy ONLY this non-production branch to Cloudflare Pages Preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler pages deploy . \
            --project-name "$PROJECT_NAME" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "FyMusic isolated UI smoothness validation" \
            > /tmp/fymusic-preview-deploy.log 2>&1; then
            echo 'FYMUSIC_PREVIEW_UPLOAD_FAILED'
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const output=fs.readFileSync('/tmp/fymusic-preview-deploy.log','utf8');
          const hosts=[...output.matchAll(/https:\/\/[a-z0-9-]+\.only-testing-online-music\.pages\.dev(?:\/)?/gi)]
            .map(x=>x[0].replace(/\/$/,''));
          const url=hosts.find(u=>{
            const host=new URL(u).hostname;
            return host!=='only-testing-online-music.pages.dev' &&
              host.endsWith('.only-testing-online-music.pages.dev');
          });
          if(!url){
            console.error('FYMUSIC_PREVIEW_URL_MISSING_OR_PRODUCTION_URL');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'preview_url='+url+'\n');
          console.log('FYMUSIC_SAFE_PREVIEW_URL '+url);
          NODE
      - name: Ensure the isolated Preview serves new FyMusic code
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          test "$PREVIEW_URL" != "https://only-testing-online-music.pages.dev"
          curl -fsSL --max-time 20 \
            "$PREVIEW_URL/src/modern-ui.js" \
            -o /tmp/fymusic-edge-ui.js
          grep -Fq 'pendingUpdates=new Set()' /tmp/fymusic-edge-ui.js
          echo 'FYMUSIC_REAL_EDGE_PREVIEW_UI_ASSET_PASS'
      - name: Install Chromium for responsive UI browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify Phase36 native touch conflicts with OS seek and rapid track switch
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase36-native-touch-os-track-browser.mjs
      - name: Verify Phase35 true hidden immersive mobile touch gesture
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: xvfb-run -a -s "-screen 0 1440x900x24" node scripts/test-fymusic-phase35-raw-cdp-mobile-background-touch.mjs
      - name: Verify Phase34 true hidden held native mouse gesture
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: xvfb-run -a -s "-screen 0 1440x900x24" node scripts/test-fymusic-phase34-raw-cdp-background-gesture.mjs
      - name: Verify Phase33 native mouse gesture seek ownership
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase33-native-mouse-seek-browser.mjs
      - name: Verify Phase33 native touch gesture seek ownership
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase33-native-touch-seek-browser.mjs
      - name: Validate Phase32 real mobile and Media Session seek ownership
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          for trial in 1 2; do
            echo "FYMUSIC_PHASE32_INDEPENDENT_TRIAL=$trial"
            node scripts/test-fymusic-phase32-real-seek-ownership-browser.mjs
          done
      - name: Validate actual Chrome document.hidden and original audio on isolated Edge preview
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          for trial in 1 2 3; do
            echo "FYMUSIC_PHASE31_INDEPENDENT_TRIAL=$trial"
            xvfb-run -a -s "-screen 0 1440x900x24" node scripts/test-fymusic-phase31-seek-state-browser.mjs
          done
          xvfb-run -a -s "-screen 0 1440x900x24" node scripts/test-fymusic-phase30-raw-cdp-real-hidden.mjs
      - name: Verify modern frame coherence on actual Cloudflare Edge
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-frame-coherence-browser.mjs
      - name: Stress long playlists and rapid lyric updates in Chromium
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-long-list-lyrics-browser.mjs
      - name: Preserve playlist rows and focus while appending on Cloudflare Preview
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-playlist-incremental-browser.mjs
      - name: Verify mobile navigation, touch targets and keyboard access
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-modern-mobile-a11y.mjs
      - name: Verify mobile immersive seek, cancelled dragging and rotation
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-immersive-mobile-seek.mjs
      - name: Verify foreground and BFCache media UI without automatic playback
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-foreground-lifecycle-browser.mjs
      - name: Verify OS Media Session actions and position state
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-media-session-browser.mjs
      - name: Verify fast track-change metadata ownership and stale artwork isolation
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-fast-track-metadata-browser.mjs
      - name: Verify cover failure races and bounded background list resources
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-cover-error-resource-stress.mjs
      - name: Soak repeated playback UI lifecycle and collect Chromium GC heap/DOM counters
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-long-session-memory-browser.mjs
      - name: Verify offline, buffering and page recovery never cause media retries
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-weak-network-recovery-browser.mjs
      - name: Verify genuine HTMLAudioElement media lifecycle with delayed fixture and invalid payload
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-real-media-lifecycle-browser.mjs
      - name: Verify streamed RFC 7233 byte ranges, true HTTP gaps and interrupted media
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-range-stream-recovery-browser.mjs
      - name: Verify real low-bandwidth audio and buffering on isolated Edge Preview
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-throttled-buffering-browser.mjs
      - name: Confirm native buffering and recovery using real Edge MP3 MSE feed
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-mse-starvation-browser.mjs
      - name: Verify direct MP3 progressive startup on isolated Cloudflare Edge
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-direct-progressive-browser.mjs
      - name: Verify primed MP3 direct audio early startup on isolated Edge
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-primed-direct-browser.mjs
      - name: Verify bounded native MP3 lead metrics on isolated Cloudflare Edge
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase22-lead-browser.mjs
      - name: Compare native MP3 Range 206 and progressive 200 on Cloudflare Edge
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase23-range-compare-browser.mjs
      - name: Repeat counterbalanced MP3 200 and 206 trials on Cloudflare Edge
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase24-repeated-range-browser.mjs
      - name: Test original MP3 AAC and FLAC real native audio on Cloudflare Edge
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase25-codecs-browser.mjs
      - name: Verify metadata hi-res formats and rapid source switching on Cloudflare Edge
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase26-metadata-hires-browser.mjs
      - name: Verify real selected-track quality, media, OS artwork and stale callback ownership on Edge
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase27-real-ui-state-browser.mjs
      - name: Verify requested quality, search platform and native OS playback state on Edge
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase28-quality-platform-os-browser.mjs
      - name: Verify actual Chromium hidden tab lifecycle and paused freeze with edge media
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/test-fymusic-phase29-real-tab-lifecycle-browser.mjs
      - name: Profile startup CPU on non-production Edge preview
        if: always() && steps.preview.outcome == 'success'
        timeout-minutes: 2
        env:
          TEST_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/diagnostics/fymusic-startup-profile.mjs
