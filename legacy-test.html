<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Legacy Browser Test</title>
  <style>
    html,body{margin:0;padding:0;background:#f4f6f8;color:#222;font-family:Arial,sans-serif;font-size:16px}
    body{padding:14px}
    h1{font-size:22px;margin:0 0 6px}
    p{margin:6px 0 12px}
    .card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
    .row{padding:8px 0;border-bottom:1px solid #eee;word-break:break-word}
    .row:last-child{border-bottom:0}
    .label{display:inline-block;min-width:150px;font-weight:bold}
    .pass{color:#087f23;font-weight:bold}
    .fail{color:#b00020;font-weight:bold}
    .warn{color:#996600;font-weight:bold}
    button,a{display:inline-block;padding:9px 12px;margin:4px 6px 4px 0;border:1px solid #bbb;border-radius:6px;background:#eee;color:#111;text-decoration:none}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f7f7;padding:8px;border-radius:4px;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Android 4.4 / Via 浏览器自检</h1>
    <p>此页面只测试浏览器与当前 Web 项目的基础能力，不测试远端音乐服务。</p>
    <div id="summary">正在检测……</div>
  </div>

  <div class="card">
    <h2>基础能力</h2>
    <div id="checks"></div>
  </div>

  <div class="card">
    <h2>设备信息</h2>
    <div id="device"></div>
  </div>

  <div class="card">
    <h2>项目资源</h2>
    <div id="resources"></div>
    <a href="./">打开音乐测试页</a>
  </div>

  <script>
  (function () {
    'use strict';

    function byId(id) { return document.getElementById(id); }

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    var checks = [];
    var passes = 0;
    var fails = 0;
    var warns = 0;

    function addCheck(name, state, detail) {
      checks.push({
        name: name,
        state: state,
        detail: detail
      });
      if (state === 'PASS') passes += 1;
      else if (state === 'FAIL') fails += 1;
      else warns += 1;
    }

    function safeTest(name, fn) {
      try {
        return fn();
      } catch (e) {
        addCheck(name, 'FAIL', String(e && e.message ? e.message : e));
        return false;
      }
    }

    addCheck('JavaScript 基础', typeof window === 'object' && typeof document === 'object' ? 'PASS' : 'FAIL',
      'window/document 可用');

    addCheck('addEventListener', typeof window.addEventListener === 'function' ? 'PASS' : 'FAIL',
      typeof window.addEventListener);

    addCheck('localStorage', safeTest('localStorage', function () {
      var key = '__legacy_test__';
      window.localStorage.setItem(key, 'ok');
      var value = window.localStorage.getItem(key);
      window.localStorage.removeItem(key);
      if (value !== 'ok') throw new Error('读写结果异常');
      return true;
    }) ? 'PASS' : 'FAIL', '读写测试');

    addCheck('JSON', typeof window.JSON === 'object' &&
      typeof window.JSON.parse === 'function' &&
      typeof window.JSON.stringify === 'function' ? 'PASS' : 'FAIL',
      typeof window.JSON);

    addCheck('Promise', typeof window.Promise === 'function' ? 'PASS' : 'FAIL',
      typeof window.Promise);

    addCheck('Uint8Array', typeof window.Uint8Array === 'function' ? 'PASS' : 'FAIL',
      typeof window.Uint8Array);

    addCheck('crypto.getRandomValues',
      window.crypto && typeof window.crypto.getRandomValues === 'function' ? 'PASS' : 'WARN',
      window.crypto ? typeof window.crypto.getRandomValues : 'crypto 不存在');

    addCheck('XMLHttpRequest', typeof window.XMLHttpRequest === 'function' ? 'PASS' : 'FAIL',
      typeof window.XMLHttpRequest);

    addCheck('fetch',
      typeof window.fetch === 'function' ? 'PASS' : 'WARN',
      typeof window.fetch);

    var audio = document.createElement('audio');
    addCheck('HTML5 Audio 元素', !!audio && typeof audio.play === 'function' ? 'PASS' : 'FAIL',
      typeof audio.play);

    var mp3 = '';
    var m4a = '';
    var ogg = '';
    if (audio && typeof audio.canPlayType === 'function') {
      mp3 = audio.canPlayType('audio/mpeg');
      m4a = audio.canPlayType('audio/mp4');
      ogg = audio.canPlayType('audio/ogg; codecs="vorbis"');
    }
    addCheck('MP3 编解码能力',
      mp3 ? 'PASS' : 'FAIL',
      mp3 || '浏览器未报告支持');

    addCheck('M4A 编解码能力',
      m4a ? 'PASS' : 'WARN',
      m4a || '浏览器未报告支持');

    addCheck('Web 项目脚本可读取',
      typeof window.XMLHttpRequest === 'function' ? 'PASS' : 'FAIL',
      '使用 XHR 检查');

    function render() {
      var html = '';
      var i;
      for (i = 0; i < checks.length; i += 1) {
        html += '<div class="row"><span class="label">' + esc(checks[i].name) +
          '</span><span class="' + (checks[i].state === 'PASS' ? 'pass' : (checks[i].state === 'FAIL' ? 'fail' : 'warn')) +
          '">' + esc(checks[i].state) + '</span> <span>' + esc(checks[i].detail) + '</span></div>';
      }
      byId('checks').innerHTML = html;

      var summaryClass = fails ? 'fail' : (warns ? 'warn' : 'pass');
      byId('summary').innerHTML =
        '<span class="' + summaryClass + '">' +
        'PASS ' + passes + ' / WARN ' + warns + ' / FAIL ' + fails +
        '</span>' +
        (fails ? '：存在需要优先处理的浏览器兼容问题。' :
          (warns ? '：基础能力基本可用，但有部分能力需要真机确认。' :
            '：基础能力全部通过。'));

      byId('device').innerHTML =
        '<div class="row"><span class="label">User Agent</span>' + esc(navigator.userAgent) + '</div>' +
        '<div class="row"><span class="label">窗口尺寸</span>' + esc(window.innerWidth) + ' × ' + esc(window.innerHeight) + '</div>' +
        '<div class="row"><span class="label">屏幕尺寸</span>' + esc(window.screen.width) + ' × ' + esc(window.screen.height) + '</div>' +
        '<div class="row"><span class="label">devicePixelRatio</span>' + esc(window.devicePixelRatio || '—') + '</div>' +
        '<div class="row"><span class="label">语言</span>' + esc(navigator.language || navigator.userLanguage || '—') + '</div>' +
        '<div class="row"><span class="label">在线状态</span>' + esc(navigator.onLine ? 'online' : 'offline') + '</div>';

      byId('resources').innerHTML =
        '<div class="row"><span class="label">MP3 canPlayType</span>' + esc(mp3 || '—') + '</div>' +
        '<div class="row"><span class="label">M4A canPlayType</span>' + esc(m4a || '—') + '</div>' +
        '<div class="row"><span class="label">OGG canPlayType</span>' + esc(ogg || '—') + '</div>' +
        '<div class="row"><span class="label">当前页面</span>' + esc(location.href) + '</div>';

      testResource('src/lx-runtime.js');
      testResource('src/source-manager.js');
      testResource('src/music-search.js');
    }

    function testResource(path) {
      if (typeof window.XMLHttpRequest !== 'function') return;
      var xhr = new XMLHttpRequest();
      xhr.open('GET', path, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        var existing = byId('resources').innerHTML;
        var state = xhr.status >= 200 && xhr.status < 300 ? 'PASS' : 'FAIL';
        byId('resources').innerHTML = existing +
          '<div class="row"><span class="label">' + esc(path) +
          '</span><span class="' + (state === 'PASS' ? 'pass' : 'fail') + '">' +
          state + '</span> HTTP ' + esc(xhr.status) + '</div>';
      };
      try {
        xhr.send(null);
      } catch (e) {
        byId('resources').innerHTML +=
          '<div class="row"><span class="label">' + esc(path) +
          '</span><span class="fail">FAIL</span> ' + esc(e.message || e) + '</div>';
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', render, false);
    } else {
      render();
    }
  }());
  </script>
</body>
</html>
