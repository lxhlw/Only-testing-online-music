name: FyMusic · Migu same-platform lyrics Preview (nonproduction)
on:
  push:
    branches: [fix/fymusic-migu-lyrics-20261103]
permissions:
  contents: read
concurrency:
  group: fymusic-migu-lyrics-branch
  cancel-in-progress: true
jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PROJECT: only-testing-online-music
      PREVIEW_BRANCH: migu-lyrics-isolated-20261103
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lock production to v0.4.29
        run: |
          test "$GITHUB_REF" = refs/heads/fix/fymusic-migu-lyrics-20261103
          test "$PREVIEW_BRANCH" != main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3249ab8471e81910fd0ef867294ecd84843c158c
          node --check functions/api/migu-lyrics.js
          node --check scripts/test-migu-lyrics-endpoint.mjs
          node --check scripts/test-migu-lyrics-preview-live.mjs
      - name: Install dependencies and browsers
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Test exact Migu lyric URL restrictions and bounded data
        run: |
          node scripts/test-migu-lyrics-endpoint.mjs
          node scripts/test-proxy-security.mjs
          node scripts/test-music-lyrics.mjs
      - name: Verify minimal Pages runtime output
        run: |
          npm run build:pages
          npm run test:pages
      - name: Publish isolated preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler pages deploy dist --project-name "$PROJECT" --branch "$PREVIEW_BRANCH" --commit-hash "$GITHUB_SHA" | tee /tmp/fymusic-migu-preview.log
          url=$(grep -Eo 'https://[0-9a-f]{8}\.only-testing-online-music\.pages\.dev' /tmp/fymusic-migu-preview.log | head -n1)
          test -n "$url"
          test "$url" != 'https://only-testing-online-music.pages.dev'
          echo "TEST_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "FYMUSIC_MIGU_LRC_PREVIEW_URL=$url"
      - name: Verify protected files remain inaccessible and API rejects unsafe URL
        run: |
          set -euo pipefail
          for i in {1..10}; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$TEST_BASE_URL/README.md")
            if test "$code" = 404; then break; fi
            sleep 2
          done
          test "$code" = 404
          code=$(curl -sSL -o /dev/null -w '%{http_code}' "$TEST_BASE_URL/api/migu-lyrics?id=abc&url=http%3A%2F%2F127.0.0.1")
          test "$code" = 400
      - name: Browser regression for Kuwo (both engines) and modern UI
        run: |
          node scripts/test-now-playing-kuwo-browser.mjs
          node scripts/test-modern-web-browser.mjs
      - name: Unmocked Sun Yanzi Migu source, LRC, cover, play and pause
        run: node scripts/test-migu-lyrics-preview-live.mjs
      - name: No production deployment
        run: echo FYMUSIC_MIGU_PREVIEW_ONLY_PRODUCTION_UNCHANGED
