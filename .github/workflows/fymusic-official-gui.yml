name: FyMusic Official LX GUI - Live KG Search
on:
  push:
    branches: [feature/fymusic-playback-verifier]
    paths:
      - '.github/workflows/fymusic-official-gui.yml'
      - 'scripts/diagnostics/fymusic-official-gui.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-gui:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Download and unpack official LX Music 2.12.6 portable Windows release
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/lyswhut/lx-music-desktop/releases/download/v2.12.6/lx-music-desktop-v2.12.6-win_x64-green.7z"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\lx-release.7z"
          $extract = "$env:RUNNER_TEMP\lx-release"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & "$env:ProgramFiles\7-Zip\7z.exe" x "$env:RUNNER_TEMP\lx-release.7z" "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Compare real official GUI catalog with FyMusic on one Windows runner
        shell: pwsh
        env:
          LX_RELEASE_DIR: ${{ runner.temp }}\lx-release
        run: |
          $site=Start-Process -FilePath "cmd.exe" -ArgumentList '/c','npx wrangler pages dev . --ip 127.0.0.1 --port 8788' -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\fymusic-parity-site.log" -RedirectStandardError "$env:RUNNER_TEMP\fymusic-parity-site.err.log"
          try {
            $ready=$false
            for ($i=0; $i -lt 55; $i++) {
              try {
                $resp=Invoke-WebRequest -Uri "http://127.0.0.1:8788/api/audio-selftest" -TimeoutSec 3
                if ($resp.StatusCode -eq 200) { $ready=$true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'FYMUSIC_LOCAL_SITE_NOT_READY' }
            node scripts/diagnostics/fymusic-official-gui.mjs
            if ($LASTEXITCODE -ne 0) { throw "OFFICIAL_GUI_PARITY_EXIT_$LASTEXITCODE" }
          } finally {
            Stop-Process -Id $site.Id -Force -ErrorAction SilentlyContinue
          }
