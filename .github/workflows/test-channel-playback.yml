name: Test Source Channel Playback Matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  channel-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate channel playback test
        run: node --check scripts/test-channel-playback.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1

      - name: Test every declared channel
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-channel-playback.mjs

      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/wrangler.log || true
