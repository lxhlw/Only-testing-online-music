name: Verify And Deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "settings.html"
      - "legacy-test.html"
      - "styles.css"
      - "src/**"
      - "functions/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/verify-and-deploy.yml"
      - ".node-version"
      - "vendor/**"
  workflow_dispatch:

concurrency:
  group: verify-and-deploy-main
  cancel-in-progress: true

jobs:
  verify:
    name: Search + Playback Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled legacy Babel
        run: |
          mkdir -p vendor
          cp node_modules/@babel/standalone/babel.min.js vendor/babel.min.js
          node scripts/test-bundled-babel.mjs

      - name: Run project baseline contract checks
        run: |
          node scripts/test-version.mjs
          node scripts/test-legacy-web.mjs

      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/lx-runtime.js
          node --check src/music-library.js
          node --check src/music-lyrics.js
          node --check src/music-search.js
          node --check src/play-settings.js
          node --check src/promise-lite.js
          node --check src/sha1.js
          node --check src/source-manager.js
          node --check src/source-transpiler.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Pages server
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8788/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1

      - name: Run Migu proxy decryption regression test
        run: node scripts/test-migu-proxy.mjs

      - name: Run deterministic search and resolver tests
        run: node scripts/test-music-search-native.mjs

      - name: Run quality fallback test
        run: node scripts/test-quality-fallback-browser.mjs

      - name: Run settings test
        run: node scripts/test-settings.mjs

      - name: Run playlist browser test
        run: node scripts/test-playlist-browser.mjs

      - name: Run responsive layout browser test
        run: node scripts/test-responsive-browser.mjs

      - name: Run search results overflow regression
        run: node scripts/test-search-layout-browser.mjs

      - name: Run music library test
        run: node scripts/test-music-library.mjs

      - name: Run lyrics test
        run: node scripts/test-music-lyrics.mjs

      - name: Run source/runtime regression tests
        run: |
          node scripts/test-source-transpiler.mjs
          node scripts/check-legacy-test.mjs

      - name: Run legacy import button test
        run: node scripts/test-import-ui.mjs

      - name: Run same-origin Babel proxy test
        run: node scripts/test-babel-proxy.mjs

      - name: Run legacy transpiler routing test
        run: node scripts/test-legacy-transpiler.mjs

      - name: Run HUIBQ ES5 adapter test
        run: node scripts/test-huibq-legacy.mjs

      - name: Run Huibq import and WY search browser test
        run: node scripts/test-huibq-browser.mjs

      - name: Show Pages server log on failure
        if: failure()
        run: cat /tmp/wrangler.log || true

  deploy:
    name: Deploy Verified Build
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled legacy Babel
        run: |
          mkdir -p vendor
          cp node_modules/@babel/standalone/babel.min.js vendor/babel.min.js
          node scripts/test-bundled-babel.mjs

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create only-testing-online-music --production-branch main || true
          npx wrangler pages deploy . --project-name only-testing-online-music --commit-hash "$GITHUB_SHA" --commit-message "Verify And Deploy $GITHUB_SHA" | tee /tmp/deploy.log
          DEPLOYMENT_URL="https://only-testing-online-music.pages.dev"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Verified production URL: $DEPLOYMENT_URL"

      - name: Wait for deployment to serve
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error "$DEPLOYMENT_URL/" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify deployed Babel bundle
        env:
          TEST_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: node scripts/test-babel-production.mjs

      - name: Install Chromium for production playlist test
        run: npx playwright install --with-deps chromium

      - name: Verify deployed responsive layout
        env:
          TEST_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: node scripts/test-responsive-browser.mjs

      - name: Verify deployed search actions are on screen
        env:
          TEST_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: node scripts/test-search-layout-browser.mjs

      - name: Verify deployed playlist detail
        env:
          TEST_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          TEST_PLAYLIST_KEYWORD: '周杰伦'
        run: node scripts/test-playlist-browser.mjs
  live-smoke:
    name: Live Flower Four-Channel Smoke Test
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live Flower search + playback matrix
        env:
          TEST_BASE_URL: ${{ needs.deploy.outputs.deployment_url }}
          LX_SOURCE_URL: https://raw.githubusercontent.com/pdone/lx-music-source/main/flower/latest.js
          TEST_KEYWORD: 成都
          TEST_CHANNELS: kw,kg,tx,wy
          REQUIRE_PLAUSIBLE_PLAYBACK: 'true'
          INIT_TIMEOUT_MS: 30000
          SEARCH_TIMEOUT_MS: 60000
          PLAYBACK_TIMEOUT_MS: 30000
        run: node scripts/test-flower-browser.mjs

  live-migu-smoke:
    name: Live Flower Migu Smoke Test
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live Flower Migu search + playback
        env:
          TEST_BASE_URL: ${{ needs.deploy.outputs.deployment_url }}
          LX_SOURCE_URL: https://raw.githubusercontent.com/pdone/lx-music-source/main/flower/latest.js
          TEST_KEYWORD: 成都
          TEST_CHANNELS: mg
          REQUIRE_PLAUSIBLE_PLAYBACK: 'true'
          INIT_TIMEOUT_MS: 30000
          SEARCH_TIMEOUT_MS: 60000
          PLAYBACK_TIMEOUT_MS: 30000
        run: node scripts/test-flower-browser.mjs
