name: FyMusic Phase 1 - Playback Evidence
on:
  push:
    branches: [feature/fymusic-playback-verifier]
    paths:
      - '.github/workflows/fymusic-playback-verifier.yml'
      - 'src/fymusic-playback-*.js'
      - 'src/fymusic-cross-platform-match.js'
      - 'scripts/test-fymusic-cross-platform-*.mjs'
      - 'src/app.js'
      - 'src/modern-ui.js'
      - 'src/mobile-shell.js'
      - 'src/mobile-shell.css'
      - 'scripts/test-fymusic-modern-mobile-a11y.mjs'
      - 'src/now-playing-experience.js'
      - 'src/player-controls.js'
      - 'scripts/test-fymusic-immersive-mobile-seek.mjs'
      - 'scripts/test-fymusic-foreground-lifecycle-browser.mjs'
      - 'scripts/test-fymusic-media-session-browser.mjs'
      - 'scripts/test-fymusic-fast-track-metadata-browser.mjs'
      - 'scripts/test-fymusic-cover-error-resource-stress.mjs'
      - 'scripts/test-fymusic-long-session-memory-browser.mjs'
      - 'scripts/test-fymusic-weak-network-recovery-browser.mjs'
      - 'scripts/test-fymusic-real-media-lifecycle-browser.mjs'
      - 'scripts/test-fymusic-range-stream-recovery-browser.mjs'
      - 'scripts/test-fymusic-throttled-buffering-browser.mjs'
      - 'functions/api/fymusic-range-selftest.js'
      - 'functions/api/fymusic-throttle-selftest.js'
      - 'src/music-lyrics.js'
      - 'scripts/test-fymusic-long-list-lyrics-browser.mjs'
      - 'scripts/test-fymusic-playlist-incremental-browser.mjs'
      - 'scripts/test-fymusic-frame-coherence-browser.mjs'
      - 'src/source-manager.js'
      - 'scripts/test-fymusic-runtime-request-privacy.mjs'
      - 'index.html'
      - 'scripts/test-fymusic-playback-*.mjs'
      - 'scripts/test-fymusic-chain-report.mjs'
      - 'scripts/test-fymusic-full-ui-browser.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playback-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify evidence engine syntax and deterministic cases
        run: |
          node --check src/fymusic-diagnostic-classifier.js
          node --check src/fymusic-chain-report.js
          node --check src/fymusic-playback-core.js
          node --check src/fymusic-playback-verifier.js
          node --check src/fymusic-cross-platform-match.js
          node --check src/source-manager.js
          node --check src/modern-ui.js
          node --check src/mobile-shell.js
          node --check scripts/test-fymusic-modern-mobile-a11y.mjs
          node --check src/now-playing-experience.js
          node --check src/player-controls.js
          node --check scripts/test-fymusic-immersive-mobile-seek.mjs
          node --check scripts/test-fymusic-foreground-lifecycle-browser.mjs
          node --check scripts/test-fymusic-media-session-browser.mjs
          node --check scripts/test-fymusic-fast-track-metadata-browser.mjs
          node --check scripts/test-fymusic-cover-error-resource-stress.mjs
          node --check scripts/test-fymusic-long-session-memory-browser.mjs
          node --check scripts/test-fymusic-weak-network-recovery-browser.mjs
          node --check scripts/test-fymusic-real-media-lifecycle-browser.mjs
          node --check scripts/test-fymusic-range-stream-recovery-browser.mjs
          node --check scripts/test-fymusic-throttled-buffering-browser.mjs
          node --check functions/api/fymusic-range-selftest.js
          node --check functions/api/fymusic-throttle-selftest.js
          node --check src/music-lyrics.js
          node --check scripts/test-fymusic-long-list-lyrics-browser.mjs
          node --check scripts/test-fymusic-playlist-incremental-browser.mjs
          node --check scripts/test-fymusic-frame-coherence-browser.mjs
          node --check scripts/test-fymusic-runtime-request-privacy.mjs
          node --test scripts/test-fymusic-playback-core.mjs scripts/test-fymusic-playback-network.mjs scripts/test-fymusic-chain-report.mjs scripts/test-fymusic-cross-platform-match.mjs
      - name: Install existing project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for real audio decoding
        run: npx playwright install --with-deps chromium
      - name: Start isolated local Cloudflare Pages server
        shell: bash
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/fymusic-pages.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8788/api/audio-selftest > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fymusic-pages.log
          exit 1
      - name: Verify authorized real media and invalid-response rejection in Chromium
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-playback-browser.mjs
      - name: Test complete UI search, row selection, source resolution and real audio
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-full-ui-browser.mjs
      - name: Verify explicit KG-to-KW approval and decoded fixture playback
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-cross-platform-browser.mjs
      - name: Verify coalesced modern UI updates and hidden immersive transport
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-frame-coherence-browser.mjs
      - name: Stress long playlists and rapid lyric updates in Chromium
        env:
          TEST_BASE_URL: ${{ 'http://127.0.0.1:8788' }}
        run: node scripts/test-fymusic-long-list-lyrics-browser.mjs
      - name: Preserve playlist rows and keyboard focus while appending a new page
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-playlist-incremental-browser.mjs
      - name: Test LX request redaction without changing signed upstream transport
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-runtime-request-privacy.mjs
      - name: Verify mobile navigation, touch targets and keyboard access
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-modern-mobile-a11y.mjs
      - name: Verify mobile immersive seek, cancelled dragging and rotation
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-immersive-mobile-seek.mjs
      - name: Verify foreground and BFCache media UI without automatic playback
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-foreground-lifecycle-browser.mjs
      - name: Verify OS Media Session actions and position state
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-media-session-browser.mjs
      - name: Verify fast track-change metadata ownership and stale artwork isolation
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-fast-track-metadata-browser.mjs
      - name: Verify cover failure races and bounded background list resources
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-cover-error-resource-stress.mjs
      - name: Soak repeated playback UI lifecycle and collect Chromium GC heap/DOM counters
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-long-session-memory-browser.mjs
      - name: Verify offline, buffering and page recovery never cause media retries
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-weak-network-recovery-browser.mjs
      - name: Verify genuine HTMLAudioElement media lifecycle with delayed fixture and invalid payload
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-real-media-lifecycle-browser.mjs
      - name: Verify HTTP 206 streamed audio gaps and interrupted transport in real Chromium
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-range-stream-recovery-browser.mjs
      - name: Verify throttled audio stream, native buffering and recovery in Chromium
        env:
          TEST_BASE_URL: http://127.0.0.1:8788
        run: node scripts/test-fymusic-throttled-buffering-browser.mjs
      - name: Show site logs on failure
        if: failure()
        run: cat /tmp/fymusic-pages.log || true
